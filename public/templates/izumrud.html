a{color:inherit}
img{display:block;max-width:100%}
svg.defs{position:absolute;width:0;height:0}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.caps{text-transform:uppercase;letter-spacing:.32em}
.wrap{max-width:620px;margin:0 auto;padding:0 28px;position:relative}

/* HERO */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:64px 40px 60px}
.hero .xframe{position:absolute;inset:0;pointer-events:none}
.hero .xframe svg{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;max-width:560px;margin:0 auto;width:100%}
.mono{width:104px;margin:0 auto 34px;display:block}
.lead{text-wrap:balance;font:500 12.5px/2 var(--serif);color:var(--muted);letter-spacing:.34em;text-transform:uppercase}
.lead b{display:block;font-weight:500;color:var(--ivory)}
.names{margin:26px 0 4px}
.names .nm{display:block;font:400 clamp(50px,14vw,84px)/1.25 var(--script);letter-spacing:0;white-space:nowrap;padding:0 .18em .08em}
.names .and{display:block;font:italic 300 clamp(24px,6.4vw,32px)/1 var(--serif);color:var(--muted);margin:2px 0 4px}
.swash{display:block;width:min(86%,300px);margin:6px auto 0;overflow:visible}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto;width:min(100%,240px);color:var(--gold)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--hair))}
.rule::after{transform:scaleX(-1)}
.rule i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex:none}
.h-when{margin-top:24px;font:500 13px/2.1 var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--ivory)}
.h-when .d{display:block;font:400 clamp(19px,5.4vw,26px)/1.5 var(--serif);letter-spacing:.16em;white-space:nowrap;color:var(--gold-hi);margin:2px 0}
.h-rsvp{margin-top:26px;font:italic 400 16px/1.5 var(--serif);color:var(--muted)}
.fi{opacity:0;animation:fade 2.2s cubic-bezier(.25,.6,.2,1) forwards}
.fi.d1{animation-delay:.2s}.fi.d2{animation-delay:.6s}.fi.d3{animation-delay:1s}.fi.d4{animation-delay:1.4s}.fi.d5{animation-delay:1.8s}

/* секции */
.hr{height:1px;width:min(78%,520px);margin:0 auto;background:linear-gradient(90deg,transparent,var(--hair) 25%,var(--hair) 75%,transparent)}
section.s{padding:84px 0;position:relative}
.sh{text-align:center;margin-bottom:40px}
.sh .num{display:block;font:500 12px/1 var(--serif);letter-spacing:.4em;color:var(--gold);margin-bottom:16px;padding-left:.4em}
.sh h2{font:400 clamp(32px,8.6vw,46px)/1.3 var(--script);color:var(--gold-hi);padding:0 .2em}
.sh .rule{margin-top:10px;width:150px}
.rv{opacity:0;transform:translateY(12px);transition:opacity 1.8s cubic-bezier(.25,.6,.2,1),transform 1.8s cubic-bezier(.25,.6,.2,1)}
.rv.in{opacity:1;transform:none}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 30px;background:transparent;color:var(--gold-hi);border:1px solid var(--gold);text-decoration:none;cursor:pointer;font:600 12.5px/1 var(--serif);letter-spacing:.3em;text-transform:uppercase;transition:background .5s,color .5s;margin-top:34px;position:relative}
.btn::after{content:"";position:absolute;inset:3px;border:1px solid var(--hair2);pointer-events:none}
.btn:hover,.btn:focus-visible{background:var(--gold);color:#10211a;outline:0}
.p{text-align:center;font-size:20px;line-height:1.75}
.p+.p{margin-top:.9em}
.small{font-size:16.5px;color:var(--muted)}

/* фото */
.photo{width:min(78vw,360px);margin:0 auto;padding:16px;border:1px solid var(--hair);position:relative;background:var(--panel)}
.photo::before{content:"";position:absolute;inset:5px;border:1px solid var(--hair2);pointer-events:none}
.photo .in{aspect-ratio:4/5;position:relative;overflow:hidden;background:var(--deep);outline:1px solid var(--hair);outline-offset:-1px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.bw img{filter:grayscale(1) contrast(1.05)}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--muted);font:500 11px/1.4 var(--serif);letter-spacing:.34em;text-transform:uppercase}
.photo .ph svg{width:72px}
.cap{text-align:center;margin-top:18px;font:italic 400 17px/1.4 var(--serif);color:var(--muted)}

/* обращение */
.sig{text-align:center;margin-top:30px;font:400 clamp(28px,8vw,36px)/1.4 var(--script);color:var(--gold-hi);white-space:nowrap}
.sig small{display:block;font:italic 400 17px/1.4 var(--serif);color:var(--muted)}

/* дата */
.date-big{text-align:center}
.date-big .wd{font:500 12.5px/1 var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.date-big .dm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;max-width:360px;margin:18px auto 0}
.date-big .dm span{font:500 13px/1.6 var(--serif);letter-spacing:.3em;text-transform:uppercase;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:8px 0}
.date-big .dm b{font:300 72px/1 var(--serif)}
.date-big .tm{margin-top:18px;font:400 22px/1 var(--serif);letter-spacing:.2em;color:var(--gold-hi)}
.count{display:grid;grid-template-columns:repeat(4,1fr);max-width:440px;margin:44px auto 0}
.count div{text-align:center;padding:4px 0}
.count div+div{border-left:1px solid var(--hair2)}
.count b{display:block;font:300 clamp(34px,9.5vw,44px)/1 var(--serif);color:var(--ivory);font-variant-numeric:tabular-nums lining-nums!important}
.count small{display:block;margin-top:10px;font:500 10.5px/1 var(--serif);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.count-done{text-align:center;margin-top:30px;font-style:italic;color:var(--muted)}

/* место */
.venue .aiv-place{width:100%;max-height:240px;object-fit:cover;margin:0 auto 18px;display:block}
.venue{text-align:center}
.venue .kind{font:500 12px/1 var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.venue h3{font:300 34px/1.2 var(--serif);margin-top:14px}
.venue .city{font:500 13px/1.6 var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.venue .how{margin-top:20px}

/* программа */
.prog{list-style:none;max-width:460px;margin:0 auto}
.prog li{display:grid;grid-template-columns:76px 22px 1fr;align-items:start;padding:0 0 30px;position:relative}
.prog li::before{content:"";position:absolute;left:86px;top:20px;bottom:-4px;width:1px;background:var(--hair2)}
.prog li:last-child::before{display:none}
.prog li:last-child{padding-bottom:0}
.prog time{font:400 22px/1.2 var(--serif);color:var(--gold-hi);text-align:right;padding-right:12px;letter-spacing:.04em}
.prog i{width:7px;height:7px;border:1px solid var(--gold);transform:rotate(45deg);margin:9px 0 0 7px;background:var(--bg);position:relative}
.prog b{display:block;font:500 14px/1.5 var(--serif);letter-spacing:.24em;text-transform:uppercase;padding-top:3px}
.prog small{display:block;font:italic 400 17px/1.45 var(--serif);color:var(--muted);margin-top:2px}

/* дресс-код */
.dress .code{text-align:center;font:400 46px/1.3 var(--script)}
.dress .p{margin-top:16px}
.sw{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:34px}
.sw figure{width:64px;text-align:center}
.sw i{display:block;width:34px;height:34px;margin:0 auto;border-radius:50%;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--hair)}
.sw figcaption{margin-top:12px;font:500 10.5px/1.4 var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* пожелания */
.notes{max-width:520px;margin:0 auto}
.notes div{text-align:center;padding:26px 0}
.notes div+div{border-top:1px solid var(--hair2)}
.notes h3{font:500 13px/1.5 var(--serif);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;padding-left:.32em}
.notes p{font-size:19px;line-height:1.7}

/* RSVP */
.rsvp-intro{text-align:center;margin-bottom:34px}
.rsvp-intro .rs{font:400 30px/1 var(--serif);letter-spacing:.3em;color:var(--gold-hi);padding-left:.3em}
.rsvp-intro p{margin-top:14px;font-style:italic;color:var(--muted)}
.rbox{border:1px solid var(--hair);padding:34px 24px;position:relative;background:rgba(8,18,14,.55)}
.rbox::before{content:"";position:absolute;inset:5px;border:1px solid var(--hair2);pointer-events:none}
#rsvp{display:grid;gap:24px;position:relative}
.f-label{display:block;font:600 11px/1.4 var(--serif);letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.f-input{width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:10px 2px;font:400 19px/1.4 var(--serif);color:var(--ivory);outline:0;border-radius:0;resize:vertical}
textarea.f-input{border:1px solid var(--hair2);padding:10px 12px}
.f-input::placeholder{color:#a3a493;font-style:italic}
.f-input:focus{border-color:var(--gold-hi)}
.f-seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-seg label{position:relative;cursor:pointer;display:flex}
.f-seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.f-seg span{display:flex;align-items:center;justify-content:center;flex:1;min-height:52px;text-align:center;padding:10px 4px;border:1px solid var(--hair);font:600 11px/1.4 var(--serif);letter-spacing:.1em;text-transform:uppercase;transition:.4s}
.f-seg input:checked+span{background:var(--gold);border-color:var(--gold);color:#10211a}
.f-seg input:focus-visible+span,.chip input:focus-visible+span{outline:1px solid var(--gold-hi);outline-offset:3px}
.f-step{display:inline-flex;align-items:center;border:1px solid var(--hair)}
.f-step-btn{width:46px;height:44px;border:0;background:transparent;color:var(--gold-hi);font:300 24px/1 var(--serif);cursor:pointer}
.f-step-val{min-width:46px;text-align:center;font:400 22px/44px var(--serif);border-left:1px solid var(--hair2);border-right:1px solid var(--hair2)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip span{display:inline-block;padding:10px 14px;border:1px solid var(--hair2);font:500 15px/1 var(--serif);cursor:pointer;transition:.4s}
.chip input:checked+span{border-color:var(--gold);color:var(--gold-hi)}
.f-yes{display:grid;gap:24px}.f-yes.off{display:none}
.f-submit{padding:18px;border:1px solid var(--gold);background:transparent;color:var(--gold-hi);font:600 12.5px/1 var(--serif);letter-spacing:.32em;text-transform:uppercase;cursor:pointer;transition:.5s}
.f-submit:hover{background:var(--gold);color:#10211a}
.f-submit:disabled{opacity:.6}
.f-error{color:#f0c9a8;font-size:16px}
.f-note{text-align:center;font-size:15.5px;font-style:italic;color:var(--muted)}
.thanks{display:none;text-align:center;padding:10px 0;position:relative}
.thanks.on{display:block;animation:fade 1.6s}
.thanks .mono{width:72px;margin-bottom:22px}
.thanks .big{font:400 32px/1.3 var(--script);white-space:nowrap;color:var(--gold-hi)}
.thanks p{margin-top:16px;text-wrap:balance}
.thanks button{margin-top:22px;border:0;background:none;color:var(--muted);font:600 11px/1 var(--serif);letter-spacing:.26em;text-transform:uppercase;border-bottom:1px solid var(--hair2);padding-bottom:4px;cursor:pointer}

/* контакты */
.people{display:grid;gap:0;max-width:520px;margin:0 auto}
.person{text-align:center;padding:26px 0}
.person+.person{border-top:1px solid var(--hair2)}
.person .role{font:500 11.5px/1.5 var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.person h3{font:300 30px/1.3 var(--serif);margin-top:8px;letter-spacing:.04em}
.person .tel{display:inline-block;margin-top:4px;text-decoration:none;font-size:20px;letter-spacing:.06em;color:var(--ivory);border-bottom:1px solid var(--hair2)}
.msg{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin-top:16px}
.msg a{font:600 11px/1 var(--serif);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);text-decoration:none;padding:6px 0;border-bottom:1px solid transparent;transition:.4s}
.msg a:hover{border-color:var(--gold)}

/* финал */
footer{text-align:center;padding:90px 0 80px;position:relative}
footer .mono{width:92px;margin-bottom:28px}
footer .bye{font:italic 400 20px/1.5 var(--serif);color:var(--muted)}
footer .fnames{margin-top:14px;font:400 44px/1.3 var(--script)}
footer .fnames span{display:block}footer .fnames small{display:block;font:italic 300 22px/1.2 var(--serif);color:var(--muted)}
footer .fdate{margin-top:10px;font:500 12px/1.8 var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}


/* ===== имена: каллиграфия контурами (build.py → NAMES_ART) ===== */
.names.art{margin:20px -26px 2px}
.nsvg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke-width:16;stroke-opacity:0}
.count b.flip{animation:flip .7s cubic-bezier(.3,.6,.3,1)}
@keyframes flip{from{transform:perspective(240px) rotateX(-80deg);opacity:.15}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* ===== анимации: включаются классом html.anim (только если не выбрано «уменьшить движение») ===== */
.anim .dr{stroke-dasharray:1 1;stroke-dashoffset:1}
.anim .ml{opacity:0}
.anim .gl{fill-opacity:0;stroke-opacity:1;stroke-dasharray:1 1;stroke-dashoffset:1}
.anim .swm{stroke-dasharray:1 1;stroke-dashoffset:1}
.anim .hero .fi{animation-play-state:paused}
.anim.play .hero .fi{animation-play-state:running}
.anim .hero .fi.d4{animation-delay:3.4s}.anim .hero .fi.d5{animation-delay:4s}
.anim.play .dr{animation:draw 2.8s cubic-bezier(.45,.05,.3,1) .1s forwards}
.anim.play .hero .mono .dr{animation-duration:2.2s;animation-delay:.2s}
.anim.play .ml{animation:fade 1.4s 1.4s forwards}
.anim.play .gl{animation:pen var(--u) calc(var(--d) + 1s) cubic-bezier(.4,0,.3,1) forwards}
.anim.play .swm{animation:draw var(--u) calc(var(--d) + 1s) cubic-bezier(.5,0,.35,1) forwards}
.anim.done .dr,.anim.done .swm{animation:none;stroke-dashoffset:0}
.anim.done .ml{animation:none;opacity:1}
.anim.done .gl{animation:none;fill-opacity:1;stroke-opacity:0;stroke-dashoffset:0}
.anim.done .hero .fi{animation:none;opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pen{0%{stroke-dashoffset:1;fill-opacity:0;stroke-opacity:1}55%{stroke-dashoffset:0;fill-opacity:.12;stroke-opacity:1}100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0}}

/* ===== конверт с сургучной печатью ===== */
html.lock,html.lock body{overflow:hidden}
.env{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;background:radial-gradient(ellipse 120% 85% at 50% 52%,#142b21 0%,#0c1a14 55%,#06100c 100%);transition:opacity 1s ease,visibility 0s 1s}
.env.out{opacity:0;visibility:hidden;pointer-events:none}
.env-t{text-align:center;transition:opacity .6s}
.env-t .k{font:500 11.5px/1 var(--serif);letter-spacing:.42em;text-transform:uppercase;color:var(--gold);padding-left:.42em}
.env-t .n{margin-top:12px;font:400 clamp(26px,7.6vw,36px)/1.3 var(--script);color:var(--gold-hi);white-space:nowrap}
.env-hint{font:500 11px/1 var(--serif);letter-spacing:.36em;text-transform:uppercase;color:var(--muted);padding-left:.36em;animation:breathe 2.8s ease-in-out infinite;transition:opacity .5s}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
.envelope{position:relative;width:min(84vw,440px);aspect-ratio:1.45;border:0;background:none;padding:0;cursor:pointer;perspective:1300px;margin-top:min(22vw,110px);-webkit-tap-highlight-color:transparent}
.envelope:focus-visible{outline:1px solid rgba(223,208,169,.45);outline-offset:8px}
.env.open .envelope{outline:none}
.e-back{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(191,170,123,.11) 0 1px,transparent 1px 8px),#0b1a14;box-shadow:0 34px 60px -24px rgba(0,0,0,.75),0 0 0 1px rgba(191,170,123,.5)}
.e-card{position:absolute;left:5%;right:5%;top:5%;height:90%;z-index:2;background:linear-gradient(#1b3a2d,#15302a);filter:drop-shadow(0 -6px 14px rgba(0,0,0,.35));box-shadow:inset 0 0 0 1px rgba(191,170,123,.5),inset 0 0 0 6px #13281f,inset 0 0 0 7px rgba(191,170,123,.25);display:flex;flex-direction:column;align-items:center;padding-top:8%;text-align:center;will-change:transform}
.e-card .mono{width:40px;margin:0 auto 6px}
.e-card .dr{animation:none!important;stroke-dashoffset:0!important}.e-card .ml{animation:none!important;opacity:1!important}
.e-card p{font:400 clamp(21px,6vw,28px)/1.25 var(--script);color:var(--gold-hi)}
.e-card small{display:block;margin-top:6px;font:500 9.5px/1 var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.e-pocket{position:absolute;inset:0;z-index:3}
.e-flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:4;transform-origin:50% 0;will-change:transform}
.e-pocket svg,.e-flap svg{display:block;width:100%;height:100%;overflow:visible}
.e-seal{position:absolute;left:50%;top:56%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:5}
.e-seal svg{display:block;width:100%;height:100%;overflow:visible}
.e-seal .sh{transform-box:fill-box;transform-origin:50% 50%}
.e-seal .crack{opacity:0}
.env.open .env-hint,.env.open .env-t{opacity:0;animation:none}
.env.open .crack{animation:crackK 1.2s forwards}
@keyframes crackK{0%{opacity:0}20%,45%{opacity:1}100%{opacity:0}}
.env.open .sh-l{animation:sealL .9s .3s cubic-bezier(.5,0,.75,0) forwards}
.env.open .sh-r{animation:sealR .9s .3s cubic-bezier(.5,0,.75,0) forwards}
.env.open .e-flap{animation:flap 1s .75s cubic-bezier(.5,0,.3,1) forwards}
.env.open .e-card{animation:cardUp 1.1s 1.5s cubic-bezier(.3,0,.2,1) forwards}
.env.open .envelope{animation:envAway 1.1s 2.5s cubic-bezier(.5,0,.6,1) forwards}
@keyframes sealL{to{transform:translate(-34%,80%) rotate(-30deg);opacity:0}}
@keyframes sealR{to{transform:translate(34%,90%) rotate(26deg);opacity:0}}
@keyframes flap{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:rotateX(180deg);z-index:1}}
@keyframes cardUp{to{transform:translateY(-76%)}}
@keyframes envAway{to{transform:scale(1.2) translateY(-6%);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:900px){
  .wrap{max-width:700px}
  .hero{padding:80px 60px}
  .mono{width:120px}
  .rbox{padding:52px 60px}
  .people{grid-template-columns:1fr 1fr;max-width:640px}
  .person+.person{border-top:0;border-left:1px solid var(--hair2)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fi,.rv{opacity:1!important;transform:none!important}}

  const ART = typeof NAMES_ART !== 'undefined' && NAMES_ART.p1 === P1 && NAMES_ART.p2 === P2 ? NAMES_ART : null;

  const rule = (cls = '') => `<div class="rule ${cls}" aria-hidden="true"><i></i></div>`;
  let n = 0;
  const sec = (title, inner, id) => { n++; return `<div class="hr"></div><section class="s" ${id ? `id="${id}"` : ''}><div class="wrap"><div class="sh rv"><span class="num">${ROMAN[n - 1]}</span><h2>${esc(title)}</h2>${rule()}</div>${inner}</div></section>`; };
  const lead = Array.isArray(T.lead) ? T.lead : [T.lead || 'Имеем честь пригласить Вас'];
  const ph = C.photo || {}, showPhoto = !!ph.hero || ph.placeholder;
  const notes = [
    ...(on('gifts') && C.gifts && C.gifts.text ? [{ title: 'Подарки', text: C.gifts.text }] : []),
    ...(on('flowers') && C.gifts && C.gifts.flowers ? [{ title: 'Цветы', text: C.gifts.flowers }] : []),
    ...((C.details || []).filter(x => x && x.text && (x.title !== 'Дети' || on('kids')) && (x.title !== 'Фотосъёмка' || on('shoot'))))
  ];
  const dc = C.dressCode || {}, R = C.rsvp || {}, prog = C.program || [];
  const dl = R.deadline ? parts(R.deadline + 'T12:00:00+03:00').long : '';

  const html = `
  <header class="hero" id="hero">
    <div class="xframe" data-orn="frame"></div>

      ${on('names') ? `<h1 class="names ${ART ? 'art' : 'fi d3'}" aria-label="${esc(P1)} и ${esc(P2)}">${namesHTML}</h1>` : ''}

      ${on('date') ? `<p class="h-when date fi d4">${esc(cap(d.weekday))}<span class="d">${esc(d.long)} года</span>в ${d.time}${on('place') && L.city ? ` · ${esc(L.city)}` : ''}</p>` : ''}

    </div>
  </header>

  ${showPhoto && on('photo') ? `<div class="hr"></div><section class="s" id="photo"><div class="wrap"><figure class="photo frame-wrap ${ph.bw ? 'bw' : ''} rv"><div class="in">${ph.hero ? `<img src="${esc(ph.hero)}" alt="${esc(P1)} и ${esc(P2)}">` : `<div class="ph">${mono('')}<span>${esc(ph.caption || 'Фотография пары')}</span></div>`}</div></figure></div></section>` : ''}

  ${on('words') && T.intro && T.intro.length ? sec('Обращение', `${T.intro.map(p => `<p class="p rv">${esc(p)}</p>`).join('')}${T.signature ? `<p class="sig rv"><small>С любовью,</small>${esc(T.signature)}</p>` : ''}`, 'words') : ''}

     <div class="count rv">${['d', 'h', 'm', 's'].map(k => `<div><b data-k="${k}">0</b><small data-l="${k}"></small></div>`).join('')}</div>
     <p class="count-done rv" hidden>Торжество состоялось. Благодарим Вас за то, что были с нами.</p>

  ${on('place') && (L.venue || L.city) ? sec('Место', `<div class="venue rv">${on('placePhoto') && L.photo ? `<img class="aiv-place" alt="" src="${esc(L.photo)}">` : ''}${L.venueType ? `<p class="kind">${esc(L.venueType)}</p>` : ''}${L.venue ? `<h3>${esc(L.venue)}</h3>` : ''}<p class="city">${esc([L.address, L.city].filter(Boolean).join(' · '))}</p>${L.howToGet ? `<p class="p small how">${esc(L.howToGet)}</p>` : ''}

  ${on('rsvp') && R.enabled !== false ? sec('Ответ', `<div class="rsvp-intro rv"><p class="rs foil">R.S.V.P.</p><p>${dl ? `Просим подтвердить Ваше присутствие до ${esc(dl)} года` : 'Просим подтвердить Ваше присутствие'}</p></div>

  document.getElementById('app').innerHTML = html;

  /* рамка героя: двойная волосяная линия с выемками в углах (ар-деко) */
  const hero = $('#hero');
  function frame() {
    const w = hero.clientWidth, h = hero.clientHeight;
    if (!hero || w < 40 || h < 40) { setTimeout(frame, 80); return; }
    const m = w < 600 ? 14 : 26, g = 5, nt = w < 600 ? 18 : 26;
    const notch = (i, k) => { const x = m + i, y = m + i, W2 = w - 2 * (m + i), H2 = h - 2 * (m + i); return `M${x + k} ${y}H${x + W2 - k}V${y + k}H${x + W2}V${y + H2 - k}H${x + W2 - k}V${y + H2}H${x + k}V${y + H2 - k}H${x}V${y + k}H${x + k}Z`; };

    const cx = w / 2;
    $('[data-orn=frame]').innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="url(#gF)" shape-rendering="geometricPrecision">
      <path class="dr" pathLength="1" d="${notch(0, nt)}" stroke-width=".9"/><path class="dr" pathLength="1" d="${notch(g, nt - g)}" stroke-width=".5" opacity=".75"/>
      ${[[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]].map(([x, y, sx, sy]) => `<path class="dr" pathLength="1" d="M${x + sx * (nt - 5)} ${y + sy * (nt - 5)}h${sx * -(nt - 9)}v${sy * -(nt - 9)}h${sx * (nt - 9)}Z" stroke-width=".6"/>`).join('')}
      <path d="M${cx - 36} ${m}H${cx + 36}M${cx - 36} ${h - m}H${cx + 36}" stroke="#10211a" stroke-width="3"/></g>
      <g class="ml" fill="url(#gF)"><path d="${dm(cx, m)}"/><path d="${dm(cx, h - m)}"/><path d="${dm(cx - 14, m, 1.4)}"/><path d="${dm(cx + 14, m, 1.4)}"/><path d="${dm(cx - 14, h - m, 1.4)}"/><path d="${dm(cx + 14, h - m, 1.4)}"/></g>
      <g class="ml" stroke="url(#gF)" stroke-width=".6"><path d="M${cx - 34} ${m}H${cx - 20}M${cx + 20} ${m}H${cx + 34}M${cx - 34} ${h - m}H${cx - 20}M${cx + 20} ${h - m}H${cx + 34}"/></g></svg>`;
  }
  function fitNames() { $$('.names .nm').forEach(el => { el.style.fontSize = ''; const box = el.parentElement.clientWidth, w = el.scrollWidth; if (w > box) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * box / w * .97) + 'px'; }); }
  const redo = () => { fitNames(); frame(); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(redo);
  redo();
  if ('ResizeObserver' in window && hero) { window.__aivObs = new ResizeObserver(redo); window.__aivObs.observe(hero); }

  const forms = { d: ['день', 'дня', 'дней'], h: ['час', 'часа', 'часов'], m: ['минута', 'минуты', 'минут'], s: ['секунда', 'секунды', 'секунд'] };
  if ($('.count')) window.__aivTimer = countdown(t => {
    if (t.done) { $('.count').hidden = true; $('.count-done').hidden = false; return; }
    ['d', 'h', 'm', 's'].forEach(k => { const b = $(`[data-k=${k}]`); if (b) { if (b.textContent !== String(t[k])) { b.textContent = t[k]; if (MOTION && b.dataset.on) { b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip'); } b.dataset.on = 1; } $(`[data-l=${k}]`).textContent = plural(t[k], forms[k]); } });
  });
  if ($('#ics')) $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  if (form) {
    bindRSVP(form, data => { form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on'); thanks.scrollIntoView({ block: 'center', behavior: MOTION ? 'smooth' : 'auto' }); if (data.attending !== 'no') setTimeout(() => confetti(thanks), MOTION ? 450 : 0); });
    const note = form.querySelector('.f-note'); if (note) note.remove();
    $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; });
  }

  /* ===== золотое конфетти после ответа ===== */
  function confetti(anchor) {
    if (!MOTION) return;
    const cv = document.createElement('canvas'), dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    cv.className = 'confetti'; cv.width = W * dpr; cv.height = H * dpr; document.body.appendChild(cv);
    const x = cv.getContext('2d'); x.scale(dpr, dpr);
    const r = anchor.getBoundingClientRect(), ox = r.left + r.width / 2, oy = Math.max(60, Math.min(H - 60, r.top + 120));
    const cols = ['#bfaa7b', '#dfd0a9', '#f1e7c8', '#9c875c', '#e4d6b0'];
    const P = Array.from({ length: 90 }, () => { const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.15, v = 3.5 + Math.random() * 7;
      return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 2 + Math.random() * 4.5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.random() * cols.length | 0], k: Math.random() < .45 }; });
    const t0 = performance.now();
    (function f(t) { const e = (t - t0) / 1000; x.clearRect(0, 0, W, H);
      for (const p of P) { p.vy += .15; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.globalAlpha = Math.max(0, 1 - e / 2.3); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
        if (p.k) { x.beginPath(); x.moveTo(0, -p.s); x.lineTo(p.s * .6, 0); x.lineTo(0, p.s); x.lineTo(-p.s * .6, 0); x.fill(); } else x.fillRect(-p.s / 2, -p.s / 5, p.s, p.s / 2.5);
        x.restore(); }
      if (e < 2.3) requestAnimationFrame(f); else cv.remove(); })(t0);
  }

  /* ===== сценарий: конверт → рамка и монограмма рисуются → имена пишутся пером → блик ===== */
  const defsSvg = document.querySelector('svg.defs'), nsvg = $('.nsvg');
  const anims = [defsSvg, nsvg].filter(Boolean);
  if (!MOTION) anims.forEach(a => a.pauseAnimations && a.pauseAnimations());
  let finished = false;
  function finish() {
    if (finished) return; finished = true; root.classList.add('play', 'done');
    if (MOTION && nsvg) $$('.smilN', nsvg).forEach(a => { try { a.beginElement(); } catch (e) {} });
  }
  function play() { root.classList.add('play'); setTimeout(finish, ((ART ? ART.total : 1.5) + 1.2) * 1000); }
  window.__aivPlay = play;
  window.__aivFinish = finish;
  /* блик не тратит батарею, когда шапка вне экрана */
  if (MOTION && 'IntersectionObserver' in window && hero) { window.__aivShine = new IntersectionObserver(es => es.forEach(e => anims.forEach(a => e.isIntersecting ? a.unpauseAnimations() : a.pauseAnimations()))); window.__aivShine.observe(hero); }

  const I = C.intro || {};
  if (window.__aivEnvStarted) { if (!document.querySelector('.env')) { root.classList.add('play', 'done'); window.scrollTo(0, keepY); } }
  else if (I.envelope === false) { window.__aivEnvStarted = true; MOTION ? play() : finish(); window.scrollTo(0, keepY); }
  else {
    window.__aivEnvStarted = true;
    const app = $('#app'), el = document.createElement('div');
    const blob = (() => { let d = ''; for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2, rr = 44 + Math.sin(a * 7) * 1.4 + Math.sin(a * 11 + 1) * 1.1 + Math.sin(a * 3 + 2) * 1.6; d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1); } return d + 'Z'; })();
    const crack = '0 -52 -3 -34 4 -17 -2 -3 5 13 -1 29 3 52';
    const cp = crack.split(' ').reduce((o, v, i, a) => i % 2 ? o : o.concat(a[i] + ',' + a[i + 1]), []).join(' ');
    el.className = 'env'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Приглашение на свадьбу');
    el.innerHTML = `<div class="env-t"><p class="k">Приглашение на свадьбу</p><p class="n">${esc(P1)} и ${esc(P2)}</p></div>
      <button class="envelope" type="button" aria-label="Открыть приглашение">
        <span class="e-back"></span>
        <span class="e-card">${mono('mono')}<p>${esc(P1)} и ${esc(P2)}</p><small>${esc(d.long)}</small></span>
        <span class="e-pocket"><svg viewBox="0 0 145 100" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="ePk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16302a" stop-opacity="0"/><stop offset="0" stop-color="#15302a"/><stop offset="1" stop-color="#0f231b"/></linearGradient></defs>
          <path d="M0 0L72.5 52L0 100Z" fill="#11271e"/><path d="M145 0L72.5 52L145 100Z" fill="#0f241b"/><path d="M0 100L72.5 45L145 100Z" fill="url(#ePk)"/>
          <g fill="none" stroke="#bfaa7b" vector-effect="non-scaling-stroke"><path d="M0 100L72.5 45L145 100" stroke-opacity=".75" vector-effect="non-scaling-stroke"/><path d="M0 0L68 48.8M145 0L77 48.8" stroke-opacity=".3" vector-effect="non-scaling-stroke"/><path d="M1.2 0V98.3H143.8V0" stroke-opacity=".35" vector-effect="non-scaling-stroke"/></g></svg></span>
        <span class="e-flap"><svg viewBox="0 0 145 100" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="eFl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173328"/><stop offset="1" stop-color="#11281f"/></linearGradient></defs>
          <path d="M0 0H145L72.5 100Z" fill="url(#eFl)"/><path d="M0 0L72.5 100L145 0" fill="none" stroke="#bfaa7b" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M8 3L72.5 91L137 3" fill="none" stroke="#bfaa7b" stroke-opacity=".3" vector-effect="non-scaling-stroke"/></svg></span>
        <span class="e-seal"><svg viewBox="-56 -56 112 112" aria-hidden="true"><defs>
          <radialGradient id="wax" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#efdfae"/><stop offset=".42" stop-color="#c6ad70"/><stop offset=".8" stop-color="#957b45"/><stop offset="1" stop-color="#6c5730"/></radialGradient>
          <radialGradient id="wax2" cx="60%" cy="65%" r="70%"><stop offset="0" stop-color="#d8c287"/><stop offset="1" stop-color="#a88f57"/></radialGradient>
          <clipPath id="cL"><polygon points="-60,-60 ${cp} -60,60"/></clipPath><clipPath id="cR"><polygon points="60,-60 ${cp} 60,60"/></clipPath>
          <g id="sealC"><path d="${blob}" transform="translate(1.5 3.5)" fill="#000" opacity=".38"/><path d="${blob}" fill="url(#wax)"/>
            <circle r="31.5" fill="url(#wax2)"/><circle r="31.5" fill="none" stroke="#6f5a31" stroke-width="2.2"/><circle r="33.2" fill="none" stroke="#f4e7bf" stroke-opacity=".45" stroke-width=".8"/>
            <circle r="27" fill="none" stroke="#7d6739" stroke-width=".6" stroke-dasharray="1.2 2.2"/>
            <g font-family="AIV Miama, cursive" font-size="27" text-anchor="middle"><text x="-.7" y="8.4" fill="#f6eac6" opacity=".55">${esc(I1)}${esc(I2)}</text><text y="9" fill="#6a552d">${esc(I1)}${esc(I2)}</text></g></g></defs>
          <g class="sh sh-l"><use href="#sealC" clip-path="url(#cL)"/></g><g class="sh sh-r"><use href="#sealC" clip-path="url(#cR)"/></g>
          <polyline class="crack" points="${cp.replace(/,/g, ' ')}" fill="none" stroke="#4f3f20" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
      </button>
      <p class="env-hint" aria-hidden="true">${esc(I.hint || 'Нажмите, чтобы открыть')}</p>`;
    document.body.appendChild(el); root.classList.add('lock'); app.inert = true; app.setAttribute('aria-hidden', 'true');
    const btn = $('.envelope', el); try { btn.focus({ preventScroll: true }); } catch (e) {}
    let st = 'closed'; const tm = [];
    const close = () => { st = 'gone'; el.remove(); root.classList.remove('lock'); app.inert = false; app.removeAttribute('aria-hidden'); window.scrollTo(0, 0); };
    const open = () => {
      if (st !== 'closed') return; st = 'opening';
      if (!MOTION) { close(); window.__aivFinish(); return; }
      el.classList.add('open');
      tm.push(setTimeout(function () { window.__aivPlay(); }, 2650), setTimeout(() => el.classList.add('out'), 2850), setTimeout(close, 3900));
    };
    const skip = () => { if (st === 'gone') return; tm.forEach(clearTimeout); close(); window.__aivFinish(); };
    btn.addEventListener('click', () => (st === 'closed' ? open() : skip()));
    el.addEventListener('pointerdown', e => { if (st === 'opening') { e.preventDefault(); skip(); } else if (st === 'closed' && !btn.contains(e.target)) open(); });
    ['wheel', 'touchmove'].forEach(ev => el.addEventListener(ev, () => { if (st === 'opening' || st === 'closed') skip(); }, { passive: true }));
    addEventListener('keydown', e => {
      if (st === 'gone') return;
      if (e.key === 'Enter' || e.key === ' ') { if (document.activeElement !== btn || st === 'opening') { e.preventDefault(); st === 'closed' ? open() : skip(); } }
      else if (['Escape', 'PageDown', 'ArrowDown', 'End'].includes(e.key)) skip();
    });
  }
  reveal();
};
window.aivPaint();
</script>
