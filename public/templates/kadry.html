<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свадьба</title>
<meta name="theme-color" content="#e8553d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;900&family=Onest:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--coral:#e8553d;--ink:#17131a;--cream:#f6efe6;--butter:#f2d27a;--blush:#f2c6bb;--olive:#55623a;--plum:#3a1f3d;
  --disp:'Unbounded',system-ui,sans-serif;--sans:'Onest',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.bgblur{position:absolute;inset:-10%;background:radial-gradient(40% 50% at 20% 30%,var(--coral),transparent 70%),radial-gradient(40% 50% at 80% 70%,var(--butter),transparent 70%),radial-gradient(50% 50% at 60% 20%,var(--plum),transparent 70%),var(--ink);filter:blur(40px);opacity:.75;transition:background .8s}
.phone{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip;container-type:inline-size;background:var(--cream);touch-action:pan-y}
.side-hint{display:none}
@media (min-width:700px){
  .phone{width:420px;height:min(880px,calc(100vh - 48px));border-radius:34px;box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 10px rgba(255,255,255,.06)}
  .side-hint{display:block;position:absolute;left:calc(50% + 250px);top:50%;transform:translateY(-50%);color:var(--cream);max-width:240px;font:400 14px/1.5 var(--sans);opacity:.8}
  .side-hint b{display:block;font:700 22px/1.15 var(--disp);margin-bottom:10px}
  .side-hint kbd{display:inline-block;border:1px solid rgba(246,239,230,.5);border-radius:6px;padding:1px 7px;margin:0 2px;font:500 12px/1.6 var(--sans)}
  .side-l{left:auto;right:calc(50% + 250px);text-align:right}
}
/* progress + header */
.top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(var(--p,0));transform-origin:left}
.on-light .bars i{background:rgba(23,19,26,.16)}.on-light .bars i::after{background:var(--ink)}
.who{display:flex;align-items:center;gap:9px;margin-top:10px;color:#fff;font:600 13px/1 var(--sans)}
.on-light .who{color:var(--ink)}
.ava{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--butter);display:grid;place-items:center;font:700 11px/1 var(--disp);box-shadow:0 0 0 2px var(--butter)}
.who small{font-weight:400;opacity:.7}
.ctrl{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.ctrl button{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:inherit;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.on-light .ctrl button{background:rgba(23,19,26,.08)}
.ctrl svg{width:16px;height:16px}

/* slides */
.slide{position:absolute;inset:0;overflow-x:clip;padding:calc(84px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  opacity:0;visibility:hidden;transform:translateX(30px) scale(.98);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.prev{transform:translateX(-30px) scale(.98)}
.slide.act{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.ani{opacity:0;transform:translateY(22px)}
.act .ani{animation:pop .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
@keyframes pop{to{opacity:1;transform:none}}
.tag{display:inline-block;align-self:flex-start;font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;border-radius:30px;border:1.5px solid currentColor}
.h{font:900 clamp(34px,11.5cqw,50px)/.95 var(--disp);letter-spacing:-.02em;text-transform:uppercase;margin-top:16px}
.p{font-size:17px;line-height:1.55;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:16px 20px;border-radius:16px;border:0;background:var(--ink);color:var(--cream);font:600 15px/1 var(--sans);text-decoration:none;cursor:pointer;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.light{background:var(--cream);color:var(--ink)}
.spacer{flex:1;min-height:12px}

/* 0 cover */
.s-cover{background:var(--coral);color:var(--cream)}
.cover-photo{position:absolute;right:-30px;top:120px;width:58%;aspect-ratio:3/4;background:var(--blush);border:8px solid var(--cream);border-bottom-width:34px;rotate:7deg;box-shadow:0 20px 40px -18px rgba(0,0,0,.45);overflow:hidden}
.cover-photo img{width:100%;height:100%;object-fit:cover}
.cover-photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--plum);background:repeating-linear-gradient(135deg,#f2c6bb 0 14px,#efbcb0 14px 28px)}
.cover-photo .ph svg{width:46px;height:46px}
.cover-photo .ph small{font:600 10px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.cover-photo .cap{position:absolute;bottom:-28px;left:0;right:0;text-align:center;font:500 12px/1 var(--sans);color:var(--ink)}
.big-names{position:relative;z-index:2;font:900 clamp(46px,16cqw,70px)/.86 var(--disp);text-transform:uppercase;letter-spacing:-.03em;margin-top:auto}
.big-names .plus{display:block;color:var(--butter);font-weight:300;font-size:.8em;line-height:.9}
.sticker{position:absolute;left:18px;top:150px;width:120px;height:120px;z-index:3;animation:spin 18s linear infinite}
.sticker text{font:700 11px var(--disp);letter-spacing:1px;fill:var(--ink)}
.cover-meta{position:relative;z-index:2;display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cover-meta span{background:var(--cream);color:var(--ink);border-radius:30px;padding:9px 14px;font:600 14px/1 var(--sans)}
.tap-hint{display:flex;align-items:center;gap:8px;margin-top:22px;font:500 13px/1 var(--sans);opacity:.9}
.tap-hint i{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;position:relative}
.tap-hint i::after{content:"";position:absolute;inset:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.5);opacity:.4}}

/* 1 words */
.s-words{background:var(--cream)}
.quote{font:900 140px/.7 var(--disp);color:var(--coral);height:70px}
.words p{font:500 21px/1.45 var(--sans);letter-spacing:-.01em}
.words p+p{margin-top:14px;font-weight:400;font-size:18px;color:#4a4350}
.sig{margin-top:22px;display:flex;align-items:center;gap:12px;font:700 15px/1.2 var(--disp);text-transform:uppercase}
.sig::before{content:"";width:34px;height:3px;background:var(--coral)}
.be{margin-top:22px;background:var(--butter);border-radius:18px;padding:16px 18px;font:500 15.5px/1.45 var(--sans)}
.be small{display:block;font:700 10px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;opacity:.7}

/* 2 date */
.s-date{background:var(--ink);color:var(--cream)}
.mega{font:900 clamp(130px,46cqw,200px)/.8 var(--disp);letter-spacing:-.05em;color:var(--butter);margin-top:16px}
.month{font:900 clamp(34px,11.5cqw,52px)/.95 var(--disp);text-transform:uppercase;letter-spacing:-.02em}
.month small{display:block;font:300 18px/1.3 var(--disp);letter-spacing:0;text-transform:none;opacity:.8;margin-top:6px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
.cd div{background:rgba(246,239,230,.08);border:1px solid rgba(246,239,230,.14);border-radius:16px;padding:12px 4px;text-align:center}
.cd b{display:block;font:700 26px/1 var(--disp);font-variant-numeric:tabular-nums}
.cd small{font:500 11px/1 var(--sans);opacity:.7}

/* 3 program */
.s-prog{background:var(--butter)}
.plist{list-style:none;margin-top:18px;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:var(--cream);border-radius:18px;padding:13px 14px}
.plist li:nth-child(odd){transform:rotate(-.6deg)}.plist li:nth-child(even){transform:rotate(.6deg)}
.plist time{font:900 21px/1 var(--disp);background:var(--ink);color:var(--butter);border-radius:12px;padding:9px 0;text-align:center}
.plist h3{font:700 15px/1.2 var(--disp);text-transform:uppercase;letter-spacing:-.01em}
.plist p{font-size:13.5px;line-height:1.35;color:#544c55;margin-top:3px}

/* 4 place */
.s-place{background:var(--olive);color:var(--cream)}
.mapart{position:relative;margin-top:18px;height:210px;border-radius:24px;overflow:hidden;background:#66744a}
.mapart svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;left:50%;top:44%;width:56px;height:56px;margin:-56px 0 0 -28px;color:var(--coral);animation:drop 1s cubic-bezier(.3,1.6,.5,1) both .5s}
.pin svg{width:100%;height:100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
@keyframes drop{from{transform:translateY(-80px);opacity:0}}
.venue{font:900 26px/1.05 var(--disp);text-transform:uppercase;margin-top:18px;letter-spacing:-.01em}
.addr{margin-top:8px;font-size:16px;opacity:.9}
.how{margin-top:10px;font-size:14px;opacity:.75}

/* 5 dress */
.s-dress{background:var(--blush)}
.stack{display:flex;margin-top:22px;padding-left:16px}
.stack i{width:80px;height:80px;border-radius:50%;margin-left:-22px;border:4px solid var(--blush);box-shadow:0 10px 20px -10px rgba(0,0,0,.35)}
.sw-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.sw-names span{display:inline-flex;align-items:center;gap:7px;background:var(--cream);border-radius:30px;padding:7px 12px 7px 7px;font:500 13px/1 var(--sans)}
.sw-names span i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}

/* 6 gifts */
.s-gift{background:var(--plum);color:var(--cream)}
.giftart{width:150px;height:150px;margin:6px 0 -6px auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.gcard{background:rgba(246,239,230,.1);border-radius:20px;padding:16px 18px;margin-top:12px}
.gcard b{display:block;font:700 13px/1 var(--disp);text-transform:uppercase;color:var(--butter);margin-bottom:6px;letter-spacing:.04em}

/* 7 RSVP */
.s-rsvp{background:var(--cream)}
#rsvp{display:grid;gap:16px;margin-top:16px}
.f-label{display:block;font:700 10.5px/1.2 var(--disp);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.f-input{width:100%;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:13px 14px;font:400 16px/1.3 var(--sans);color:var(--ink);outline:0;resize:none}
.f-input:focus{box-shadow:4px 4px 0 var(--coral)}
.f-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f-seg label{position:relative;cursor:pointer}
.f-seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.f-seg span{display:block;text-align:center;padding:14px 4px;border-radius:14px;border:2px solid var(--ink);font:600 14px/1.15 var(--sans);background:#fff;transition:.2s}
.f-seg input:checked+span{background:var(--coral);color:#fff;border-color:var(--coral);box-shadow:4px 4px 0 var(--ink)}
.f-step{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.f-step-btn{width:48px;height:46px;border:0;background:#fff;font:700 22px/1 var(--disp);cursor:pointer;color:var(--ink)}
.f-step-val{min-width:44px;text-align:center;font:900 22px/46px var(--disp);background:var(--butter)}
.f-chips{display:flex;flex-wrap:wrap;gap:7px}
.chip span{display:inline-block;padding:10px 13px;border-radius:30px;border:2px solid var(--ink);background:#fff;font:600 13px/1 var(--sans);cursor:pointer}
.chip input:checked+span{background:var(--ink);color:var(--butter)}
.f-yes{display:grid;gap:16px}.f-yes.off{display:none}
.f-submit{padding:18px;border:0;border-radius:16px;background:var(--coral);color:#fff;font:700 14px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.f-submit:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.f-submit:disabled{opacity:.6}
.f-error{color:#b3261e;font-weight:600;font-size:14px}
.f-note{text-align:center;font-size:13px;color:#6b6370}
.thanks{display:none;margin-top:24px;background:var(--coral);color:var(--cream);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:6px 6px 0 var(--ink)}
.thanks.on{display:block;animation:pop .6s cubic-bezier(.2,.8,.2,1)}
.thanks .big{font:900 40px/1 var(--disp);text-transform:uppercase}
.thanks p{margin-top:12px;font-size:16px}
.thanks button{margin-top:16px;background:none;border:0;color:inherit;font:600 13px/1 var(--sans);text-decoration:underline;cursor:pointer}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:conf 2.2s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

/* 8 contacts */
.s-contacts{background:var(--ink);color:var(--cream)}
.pcard{background:rgba(246,239,230,.07);border:1px solid rgba(246,239,230,.12);border-radius:22px;padding:16px;margin-top:12px}
.pcard h3{font:700 18px/1.1 var(--disp);text-transform:uppercase}
.pcard .role{font-size:13px;opacity:.65;margin-top:3px}
.pcard .tel{display:inline-block;margin-top:6px;font-weight:600;text-decoration:none;color:var(--butter)}
.msg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.msg a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 2px 9px;border-radius:14px;text-decoration:none;font:600 11px/1 var(--sans);color:#fff}
.msg a svg{width:22px;height:22px}
.msg .telegram{background:#2aa3de}.msg .viber{background:#7360f2}.msg .whatsapp{background:#25c063}.msg .phone{background:var(--coral)}
.finale{font:900 clamp(32px,11cqw,48px)/.95 var(--disp);text-transform:uppercase;margin-top:26px;color:var(--butter)}

/* nav zones + menu */
.zone{position:absolute;top:80px;bottom:0;z-index:5}
.menu{position:absolute;inset:0;z-index:40;background:rgba(23,19,26,.92);backdrop-filter:blur(8px);color:var(--cream);padding:90px 22px 30px;display:none;flex-direction:column;gap:8px}
.menu.on{display:flex;animation:pop .35s ease}
.menu button{text-align:left;background:rgba(246,239,230,.07);border:0;color:inherit;border-radius:16px;padding:15px 16px;font:700 15px/1 var(--disp);text-transform:uppercase;cursor:pointer;display:flex;gap:12px;align-items:center}
.menu button span{color:var(--butter);font-weight:300;width:24px}
.menu .close{position:absolute;top:24px;right:18px;width:40px;height:40px;justify-content:center;padding:0;border-radius:50%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ani{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="bgblur"></div>
  <div class="side-hint side-l"><b>Свадебные<br>сториз</b>Листайте, как в Instagram</div>
  <div class="phone" id="phone"></div>
  <div class="side-hint"><b>Управление</b>Клик справа — дальше, слева — назад. Или клавиши <kbd>←</kbd> <kbd>→</kbd>. Удерживайте, чтобы остановить.</div>
</div>
<script>
/* =====================================================================
   CONFIG — ВСЕ ДАННЫЕ ПАРЫ. Конструктор подставляет сюда свои значения.
   Схема описана в README.md. Пустая строка/пустой массив = слайд скрыт.
   ===================================================================== */
const CONFIG = {
  template: "kadry",
  siteId: "",
  couple: { partner1: "Даша", partner2: "Никита", monogram: "Д+Н" },
  date: { start: "2027-09-18T16:00:00+03:00", end: "2027-09-19T00:30:00+03:00", timezone: "Europe/Minsk" },
  location: {
    city: "Гомель",
    venueType: "Лофт",
    venue: "Лофт «Фабрика 1927»",
    address: "ул. Речная, 14, Гомель",
    coords: [52.4345, 30.9754],
    mapUrl: "",
    howToGet: "Вход со стороны набережной, парковка у ворот. Регистрация в 13:30 — только для семьи."
  },
  photo: { hero: "", caption: "ваше фото" },
  texts: {
    sticker: "МЫ ЖЕНИМСЯ • МЫ ЖЕНИМСЯ • ",
    intro: [
      "Мы решили: хватит просто встречаться — пора устроить самую большую вечеринку в нашей жизни.",
      "Будет вкусный ужин, лучший диджей Гомеля и танцпол до утра. Без скучных конкурсов, обещаем. Не хватает только вас."
    ],
    signature: "Даша и Никита",
    belarusian: "Чакаем вас! Будзе весела.",
    closing: "До встречи на танцполе!"
  },
  program: [
    { time: "13:30", title: "Регистрация", text: "Дворец бракосочетания — для самых близких" },
    { time: "16:00", title: "Сбор гостей", text: "Welcome-бар и фотозона в лофте" },
    { time: "17:00", title: "Ужин", text: "Длинный стол, тосты, первый танец" },
    { time: "20:00", title: "Вечеринка", text: "DJ-сет и танцпол до упаду" },
    { time: "23:30", title: "Торт", text: "И сюрприз для всех гостей" }
  ],
  gifts: {
    text: "Лучший подарок — конверт: мы копим на путешествие в Японию. Обещаем прислать открытку из Киото!",
    flowers: "Цветы не нужны — они завянут, пока мы танцуем. Лучше приходите в хорошем настроении."
  },
  dressCode: {
    title: "Яркий коктейль",
    text: "Смело! Коктейльные платья, яркие рубашки, костюмы любого цвета. Главное — удобная обувь для танцев.",
    colors: [
      { name: "Коралл", hex: "#e8553d" }, { name: "Масло", hex: "#f2d27a" }, { name: "Пудра", hex: "#f2c6bb" },
      { name: "Олива", hex: "#55623a" }, { name: "Слива", hex: "#3a1f3d" }
    ]
  },
  contacts: [
    { name: "Даша", role: "Невеста", phone: "+375 29 000-00-21", telegram: "" },
    { name: "Никита", role: "Жених", phone: "+375 25 000-00-22", telegram: "" }
  ],
  rsvp: {
    endpoint: "",            // URL вашего бэкенда (POST JSON). Пусто = демо-режим
    deadline: "2027-08-20",
    maxGuests: 4,
    drinks: ["Вино", "Коктейли", "Крепкое", "Пиво", "Без алкоголя"]
  },
  stories: { autoplaySec: 9 },  // 0 = без автопрокрутки
  theme: { coral: "#e8553d", ink: "#17131a", cream: "#f6efe6", butter: "#f2d27a", blush: "#f2c6bb", olive: "#55623a", plum: "#3a1f3d" }
};
/* ==========================================================================
   WEDDING CORE v1 — общий движок для всех шаблонов (вставляется при сборке).
   Ничего здесь не меняйте под конкретную пару: все данные — в CONFIG выше.
   ========================================================================== */
const W = (() => {
  const C = CONFIG;
  const TZ = (C.date && C.date.timezone) || 'Europe/Minsk';
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    <span class="tag ani" ${a()}>Тайминг</span><h2 class="h ani" ${a()}>План<br>на день</h2>
    <ul class="plist">${C.program.map(p => `<li class="ani" ${a()}><time>${esc(p.time)}</time><div><h3>${esc(p.title)}</h3>${p.text ? `<p>${esc(p.text)}</p>` : ''}</div></li>`).join('')}</ul>`);

  if (on('place')) add('s-place', false, 'Место', () => `
    <span class="tag ani" ${a()}>${esc(L.venueType || 'Место')}</span>
    ${on('placePhoto') ? `<div class="mapart ani" ${a()}>${L.photo ? `<img class="aiv-place" alt="" src="${esc(L.photo)}" style="width:100%;height:100%;object-fit:cover">` : `<svg viewBox="0 0 360 210" preserveAspectRatio="xMidYMid slice"><g stroke="#7d8b5f" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-10 60 C80 70 140 30 380 50"/><path d="M60 -10 C70 80 50 150 80 230"/><path d="M-10 160 C120 150 220 175 380 150"/><path d="M250 -10 C240 70 280 140 260 230"/></g><path d="M-10 196 C90 182 200 206 380 186 V220 H-10Z" fill="#8fb0e0" opacity=".6"/><g fill="#71804f"><rect x="96" y="70" width="60" height="44" rx="6"/><rect x="170" y="78" width="54" height="56" rx="6"/><rect x="286" y="70" width="60" height="64" rx="6"/><rect x="100" y="16" width="120" height="22" rx="6"/></g></svg><div class="pin">${icons.map}</div>`}</div>` : ''}
    <div class="venue ani" ${a()}>${esc(L.venue)}</div><div class="addr ani" ${a()}>${esc(L.address)}</div>${L.howToGet ? `<div class="how ani" ${a()}>${esc(L.howToGet)}</div>` : ''}
    <div class="spacer"></div>${on('map') ? `<a class="btn light ani" ${a()} href="${esc(mapUrl())}" target="_blank" rel="noopener">${icons.map}Открыть на карте</a>` : ''}`);

  if (on('dress') && C.dressCode) add('s-dress', true, 'Дресс-код', () => `
    <span class="tag ani" ${a()}>Дресс-код</span><h2 class="h ani" ${a()}>${esc(C.dressCode.title || 'Дресс-код')}</h2>
    <p class="p ani" ${a()}>${esc(C.dressCode.text)}</p>
    <div class="stack ani" ${a()}>${(C.dressCode.colors || []).map(c => `<i style="background:${esc(c.hex)}"></i>`).join('')}</div>`);

  if ((on('gifts') && C.gifts && C.gifts.text) || (on('flowers') && C.gifts && C.gifts.flowers)) add('s-gift', false, 'Подарки', () => `
    <span class="tag ani" ${a()}>Подарки</span>
    <svg class="giftart ani" ${a()} viewBox="0 0 150 150"><rect x="25" y="62" width="100" height="74" rx="8" fill="#e8553d"/><rect x="18" y="46" width="114" height="24" rx="6" fill="#f2c6bb"/><rect x="68" y="46" width="14" height="90" fill="#f2d27a"/><path d="M75 46c-10-22-38-24-36-6 2 12 36 6 36 6zm0 0c10-22 38-24 36-6-2 12-36 6-36 6z" fill="none" stroke="#f2d27a" stroke-width="7" stroke-linejoin="round"/></svg>
    <h2 class="h ani" ${a()}>О подарках</h2>
    ${on('gifts') && C.gifts.text ? `<div class="gcard ani" ${a()}><b>Что подарить</b>${esc(C.gifts.text)}</div>` : ''}
    ${on('flowers') && C.gifts.flowers ? `<div class="gcard ani" ${a()}><b>Про цветы</b>${esc(C.gifts.flowers)}</div>` : ''}`);

  if (on('rsvp')) add('s-rsvp', true, 'Анкета', () => `
    <span class="tag ani" ${a()}>Анкета гостя</span><h2 class="h ani" ${a()}>Вы<br>с нами?</h2>
    <div class="ani" ${a()}><form id="rsvp"></form><div class="thanks" id="thanks" aria-live="polite"><div class="big">Ура!</div><p id="thanksText"></p><button type="button" id="again">Изменить ответ</button></div></div>`);

  if (on('contacts') && C.contacts && C.contacts.length) add('s-contacts', false, 'Контакты', () => `
    <span class="tag ani" ${a()}>Связь</span><h2 class="h ani" ${a()}>Пишите<br>в один тап</h2>
    ${C.contacts.map(c => `<div class="pcard ani" ${a()}><h3>${esc(c.name)}</h3><div class="role">${esc(c.role || '')}</div><a class="tel" href="tel:+${String(c.phone).replace(/\D/g, '')}">${esc(c.phone)}</a><div class="msg">${contactLinks(c).map(l => `<a class="${l.type}" href="${esc(l.href)}" target="_blank" rel="noopener">${icons[l.type]}${l.label === 'Позвонить' ? 'Звонок' : l.label}</a>`).join('')}</div></div>`).join('')}
    <div class="finale ani" ${a()}>${esc(T.closing || '')}</div>`);

  const phone = $('#phone');
  phone.innerHTML = `
    <div class="top"><div class="bars">${slides.map(() => '<i></i>').join('')}</div>
      <div class="who"><span class="ava">${esc(C.couple.monogram || '')}</span><span>${esc(C.couple.partner1)} и ${esc(C.couple.partner2)} <small>· ${d.dotted}</small></span>
        <span class="ctrl"><button type="button" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button><button type="button" id="menuBtn" aria-label="Все разделы"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="6" width="16" height="2.2" rx="1"/><rect x="4" y="11" width="16" height="2.2" rx="1"/><rect x="4" y="16" width="16" height="2.2" rx="1"/></svg></button></span></div></div>
    ${slides.map((s, i) => `<section class="slide ${s.cls}" data-i="${i}" aria-label="${esc(s.title)}">${s.html}</section>`).join('')}
    <div class="zone" id="zl" style="left:0;width:33%"></div><div class="zone" id="zr" style="right:0;width:67%"></div>
    <nav class="menu" id="menu"><button class="close" type="button" id="menuClose" aria-label="Закрыть">✕</button>${slides.map((s, i) => `<button type="button" data-go="${i}"><span>${String(i + 1).padStart(2, '0')}</span>${esc(s.title)}</button>`).join('')}</nav>`;

  /* ---------- движок сториз ---------- */
  const els = $$('.slide', phone), bars = $$('.bars i', phone), top = $('.top', phone);
  const AUTO = ((C.stories && C.stories.autoplaySec) || 0) * 1000;
  const rsvpIndex = slides.findIndex(s => s.cls === 's-rsvp');
  let cur = 0, t0 = 0, paused = false, held = false, raf;
  const interactive = i => ['s-rsvp', 's-contacts'].includes(slides[i].cls);

  function go(i, pause) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    els.forEach((el, j) => { el.classList.toggle('act', j === i); el.classList.toggle('prev', j < i); });
    // перезапуск анимаций появления
    const el = els[i]; el.scrollTop = 0; el.querySelectorAll('.ani').forEach(n => { n.style.animation = 'none'; n.offsetHeight; n.style.animation = ''; });
    cur = i; t0 = performance.now();
    if (pause !== undefined) paused = !!pause;
    phone.classList.toggle('on-light', slides[i].light);
    document.querySelector('meta[name=theme-color]').content = getComputedStyle(el).backgroundColor;
    bars.forEach((b, j) => b.style.setProperty('--p', j < i ? 1 : 0));
    // зоны тапа не перекрывают интерактивные слайды
    $('#zl').style.display = $('#zr').style.display = interactive(i) ? 'none' : '';
  }
  function loop(now) {
    const stop = paused || held || !AUTO || interactive(cur) || $('#menu').classList.contains('on');
    if (stop) t0 = now - (parseFloat(bars[cur].style.getPropertyValue('--p')) || 0) * AUTO;
    const p = AUTO ? Math.min(1, (now - t0) / AUTO) : 1;
    if (!interactive(cur)) bars[cur].style.setProperty('--p', AUTO ? p : 1);
    else bars[cur].style.setProperty('--p', 1);
    if (!stop && p >= 1 && cur < slides.length - 1) go(cur + 1);
    raf = requestAnimationFrame(loop);
  }
  const next = () => go(cur + 1), prev = () => go(cur - 1);
  // тапы: левая треть — назад, остальное — вперёд; удержание — пауза
  let downAt = 0, sx = 0, sy = 0;
  phone.addEventListener('pointerdown', e => { if (e.target.closest('.zone')) { downAt = Date.now(); held = true; } sx = e.clientX; sy = e.clientY; });
  phone.addEventListener('pointerup', e => {
    held = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); return; } // свайп (в т.ч. на интерактивных слайдах)
    if (!e.target.closest('.zone') || Date.now() - downAt > 450) return;
    e.target.id === 'zl' ? prev() : next();
  });
  phone.addEventListener('pointercancel', () => held = false);
  if (window.__aivKey) document.removeEventListener('keydown', window.__aivKey);
  window.__aivKey = (e) => { if (e.target.closest('input,textarea')) return; if (e.key === 'ArrowRight' || e.key === ' ') next(); if (e.key === 'ArrowLeft') prev(); };
  document.addEventListener('keydown', window.__aivKey);
  $('#pauseBtn').addEventListener('click', () => { paused = !paused; $('#pauseBtn').innerHTML = paused ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'; });
  $('#menuBtn').addEventListener('click', () => $('#menu').classList.add('on'));
  $('#menuClose').addEventListener('click', () => $('#menu').classList.remove('on'));
  $$('[data-go]').forEach(b => b.addEventListener('click', () => { $('#menu').classList.remove('on'); go(+b.dataset.go); }));

  // данные
  const forms = { d: ['день','дня','дней'], h: ['час','часа','часов'], m: ['минута','минуты','минут'], s: ['секунда','секунды','секунд'] };
  window.__aivTimer = countdown(t => ['d','h','m','s'].forEach(x => { const b = $(`[data-k=${x}]`); if (b) { b.textContent = t[x]; $(`[data-l=${x}]`).textContent = plural(t[x], forms[x]); } }));
  $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  bindRSVP(form, data => {
    form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on');
    if (data.attending === 'yes') { const cf = document.createElement('div'); cf.className = 'confetti'; const cols = ['#e8553d', '#f2d27a', '#f2c6bb', '#55623a', '#3a1f3d'];
      cf.innerHTML = Array.from({ length: 60 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${cols[i % 5]};--x:${(Math.random() - .5) * 160}px;--r:${Math.random() * 720}deg;animation-delay:${Math.random() * .4}s"></i>`).join('');
      phone.appendChild(cf); setTimeout(() => cf.remove(), 3000); }
  });
  $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; });

  go(0); window.__aivRaf = raf = requestAnimationFrame(loop);
  // API для конструктора/превью: STORIES.go(индекс, пауза)
  window.STORIES = { count: slides.length, go, rsvpIndex, get current() { return cur; } };
  window.scrollTo(0, keepY);
  if (keepSlide >= 0 && window.STORIES && window.STORIES.go) window.STORIES.go(keepSlide, true);
};
window.aivPaint();
</script>
</body>
</html>
