a{color:inherit}
img{display:block;max-width:100%}
svg.defs{position:absolute;width:0;height:0}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.caps{text-transform:uppercase;letter-spacing:.32em}
.wrap{max-width:620px;margin:0 auto;padding:0 28px;position:relative}

/* HERO */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:64px 40px 60px}
.hero .xframe{position:absolute;inset:0;pointer-events:none}
.hero .xframe svg{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;max-width:560px;margin:0 auto;width:100%}
.mono{width:104px;margin:0 auto 34px;display:block}
.lead{text-wrap:balance;font:500 12.5px/2 var(--serif);color:var(--muted);letter-spacing:.34em;text-transform:uppercase}
.lead b{display:block;font-weight:500;color:var(--ivory)}
.names{margin:30px 0 26px}
.names .nm{display:block;font:400 clamp(34px,10.4vw,62px)/1.08 var(--serif);letter-spacing:.16em;text-transform:uppercase;padding-left:.16em;white-space:nowrap}

      ${on('names') ? `<h1 class="names fi d3" aria-label="${esc(P1)} и ${esc(P2)}"><span class="nm foil">${esc(P1)}</span><span class="and foil">и</span><span class="nm foil">${esc(P2)}</span></h1>` : ''}
      <div class="fi d4">${rule()}</div>
      ${on('date') ? `<p class="h-when date fi d4">${esc(cap(d.weekday))}<span class="d">${esc(d.long)} года</span>в ${d.time}${on('place') && L.city ? ` · ${esc(L.city)}` : ''}</p>` : ''}
      ${on('rsvp') && dl ? `<p class="h-rsvp fi d5">R.S.V.P. до ${esc(dl)}</p>` : ''}
    </div>
  </header>

  ${showPhoto && on('photo') ? `<div class="hr"></div><section class="s" id="photo"><div class="wrap"><figure class="photo frame-wrap ${ph.bw ? 'bw' : ''} rv"><div class="in">${ph.hero ? `<img src="${esc(ph.hero)}" alt="${esc(P1)} и ${esc(P2)}">` : `<div class="ph">${mono('')}<span>${esc(ph.caption || 'Фотография пары')}</span></div>`}</div></figure></div></section>` : ''}

  ${on('words') && T.intro && T.intro.length ? sec('Обращение', `${T.intro.map(p => `<p class="p rv">${esc(p)}</p>`).join('')}${T.signature ? `<p class="sig rv"><small>С любовью,</small>${esc(T.signature)}</p>` : ''}`, 'words') : ''}

  ${on('timer') && C.date && C.date.start ? sec('Дата и время', `<div class="date-big rv"><p class="wd">${esc(d.weekday)}</p><div class="dm"><span>${esc(d.monthGen)}</span><b class="foil">${d.dd}</b><span>${d.year}</span></div><p class="tm">${d.time}</p></div>
     <div class="count rv">${['d', 'h', 'm', 's'].map(k => `<div><b data-k="${k}">0</b><small data-l="${k}"></small></div>`).join('')}</div>
     <p class="count-done rv" hidden>Торжество состоялось. Благодарим Вас за то, что были с нами.</p>
     <div class="center rv"><button class="btn" id="ics">Добавить в календарь</button></div>`, 'when') : ''}

  ${on('place') && (L.venue || L.city) ? sec('Место', `<div class="venue rv">${on('placePhoto') && L.photo ? `<img class="aiv-place" alt="" src="${esc(L.photo)}">` : ''}${L.venueType ? `<p class="kind">${esc(L.venueType)}</p>` : ''}${L.venue ? `<h3>${esc(L.venue)}</h3>` : ''}<p class="city">${esc([L.address, L.city].filter(Boolean).join(' · '))}</p>${L.howToGet ? `<p class="p small how">${esc(L.howToGet)}</p>` : ''}
     ${on('map') ? `<a class="btn" href="${esc(mapUrl())}" target="_blank" rel="noopener">Открыть на карте</a>` : ''}</div>`, 'place') : ''}

  ${on('program') && prog.length ? sec('Программа вечера', `<ol class="prog">${prog.map(p => `<li class="rv"><time>${esc(p.time)}</time><i></i><div><b>${esc(p.title)}</b>${p.text ? `<small>${esc(p.text)}</small>` : ''}</div></li>`).join('')}</ol>`, 'program') : ''}

  ${on('dress') && (dc.title || dc.text || (dc.colors && dc.colors.length)) ? sec('Дресс-код', `<div class="dress rv">${dc.title ? `<p class="code foil">${esc(dc.title)}</p>` : ''}${dc.text ? `<p class="p">${esc(dc.text)}</p>` : ''}
     ${dc.colors && dc.colors.length ? `<div class="sw">${dc.colors.map(c => `<figure><i style="background:${esc(c.hex)}"></i>${/^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(c.name || '').trim()) ? '' : '<figcaption>' + esc(c.name) + '</figcaption>'}</figure>`).join('')}</div>` : ''}</div>`, 'dress') : ''}

  ${notes.length ? sec('Пожелания', `<div class="notes gifts">${notes.map(x => `<div class="rv card"><h3>${esc(x.title || '')}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`, 'wishes') : ''}

  ${on('rsvp') && R.enabled !== false ? sec('Ответ', `<div class="rsvp-intro rv"><p class="rs foil">R.S.V.P.</p><p>${dl ? `Просим подтвердить Ваше присутствие до ${esc(dl)} года` : 'Просим подтвердить Ваше присутствие'}</p></div>
     <div class="rbox rv"><form id="rsvp"></form><div class="thanks" id="thanks" aria-live="polite">${mono()}<div class="big">Ответ получен</div><p id="thanksText"></p><button type="button" id="again">Изменить ответ</button></div></div>`, 'rsvp-section') : ''}

  ${on('contacts') && C.contacts && C.contacts.length ? sec('Контакты', `<div class="people">${C.contacts.map(c => `<div class="person rv"><p class="role">${esc(c.role || '')}</p><h3>${esc(c.name)}</h3>${c.phone ? `<a class="tel" href="tel:+${String(c.phone).replace(/\D/g, '')}">${esc(c.phone)}</a>` : ''}<div class="msg">${contactLinks(c).filter(l => l.type !== 'phone').map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener" aria-label="${l.label}: ${esc(c.name)}">${l.label}</a>`).join('')}</div></div>`).join('')}</div>`, 'contacts') : ''}

  <div class="hr"></div>
  <footer class="rv"><div class="wrap">${mono()}${T.closing ? `<p class="bye">${esc(T.closing)}</p>` : ''}<p class="fnames"><span class="foil">${esc(P1)}</span><small>и</small><span class="foil">${esc(P2)}</span></p><p class="fdate">${esc(d.long)} · ${esc(L.city || '')}</p></div></footer>`;

  document.getElementById('app').innerHTML = html;

  /* рамка героя: двойная волосяная линия с выемками в углах (ар-деко) */
  const hero = $('#hero');
  function frame() {
    const w = hero.clientWidth, h = hero.clientHeight;
    if (!hero || w < 40 || h < 40) { setTimeout(frame, 80); return; }
    const m = w < 600 ? 14 : 26, g = 5, nt = w < 600 ? 18 : 26;
    const notch = (i, k) => { const x = m + i, y = m + i, W2 = w - 2 * (m + i), H2 = h - 2 * (m + i); return `M${x + k} ${y}H${x + W2 - k}V${y + k}H${x + W2}V${y + H2 - k}H${x + W2 - k}V${y + H2}H${x + k}V${y + H2 - k}H${x}V${y + k}H${x + k}Z`; };
    const dm = (x, y, r = 2.6) => `M${x} ${y - r}L${x + r} ${y}L${x} ${y + r}L${x - r} ${y}Z`;
    const cx = w / 2;
    $('[data-orn=frame]').innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="url(#gF)" shape-rendering="geometricPrecision">
      <path d="${notch(0, nt)}" stroke-width=".9"/><path d="${notch(g, nt - g)}" stroke-width=".5" opacity=".75"/>
      ${[[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]].map(([x, y, sx, sy]) => `<path d="M${x + sx * (nt - 5)} ${y + sy * (nt - 5)}h${sx * -(nt - 9)}v${sy * -(nt - 9)}h${sx * (nt - 9)}Z" stroke-width=".6"/>`).join('')}
      <path d="M${cx - 36} ${m}H${cx + 36}M${cx - 36} ${h - m}H${cx + 36}" stroke="#0c0c0b" stroke-width="3"/></g>
      <g fill="url(#gF)"><path d="${dm(cx, m)}"/><path d="${dm(cx, h - m)}"/><path d="${dm(cx - 14, m, 1.4)}"/><path d="${dm(cx + 14, m, 1.4)}"/><path d="${dm(cx - 14, h - m, 1.4)}"/><path d="${dm(cx + 14, h - m, 1.4)}"/></g>
      <g stroke="url(#gF)" stroke-width=".6"><path d="M${cx - 34} ${m}H${cx - 20}M${cx + 20} ${m}H${cx + 34}M${cx - 34} ${h - m}H${cx - 20}M${cx + 20} ${h - m}H${cx + 34}"/></g></svg>`;
  }
  function fitNames() { $$('.names .nm').forEach(el => { el.style.fontSize = ''; const box = el.parentElement.clientWidth, w = el.scrollWidth; if (w > box) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * box / w * .97) + 'px'; }); }
  const redo = () => { fitNames(); frame(); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(redo);
  redo();
  if ('ResizeObserver' in window && hero) { window.__aivObs = new ResizeObserver(redo); window.__aivObs.observe(hero); }
  window.scrollTo(0, keepY);

  const forms = { d: ['день', 'дня', 'дней'], h: ['час', 'часа', 'часов'], m: ['минута', 'минуты', 'минут'], s: ['секунда', 'секунды', 'секунд'] };
  if ($('.count')) window.__aivTimer = countdown(t => {
    if (t.done) { $('.count').hidden = true; $('.count-done').hidden = false; return; }
    ['d', 'h', 'm', 's'].forEach(k => { const b = $(`[data-k=${k}]`); if (b) { b.textContent = t[k]; $(`[data-l=${k}]`).textContent = plural(t[k], forms[k]); } });
  });
  if ($('#ics')) $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  if (form) {
    bindRSVP(form, data => { form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on'); });
    const note = form.querySelector('.f-note'); if (note) note.remove();
    $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; });
  }
  reveal();
};
window.aivPaint();
</script>
</body>
</html>
