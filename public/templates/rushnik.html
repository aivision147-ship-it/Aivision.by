<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свадьба</title>
<meta name="theme-color" content="#f1eadc">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--linen:#f1eadc;--white:#fbf8f2;--red:#a51d24;--deep:#2b1d1a;--muted:#6e5f57;--thread:#c9b9a0;
  --disp:'Prata',Georgia,serif;--sans:'Golos Text',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{color:var(--deep);font:400 16.5px/1.65 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background-color:var(--linen);
  background-image:repeating-linear-gradient(0deg,rgba(120,95,60,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,95,60,.04) 0 1px,transparent 1px 4px)}
a{color:inherit}
svg.defs{position:absolute;width:0;height:0}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
.band{display:block;width:100%;height:var(--bh,75px)}
.band.stitch{clip-path:inset(0 100% 0 0);transition:clip-path 2.2s steps(40,end)}
.band.stitch.in{clip-path:inset(0 0 0 0)}
.kick{font:600 11px/1.3 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--red)}

/* HERO */
.hero{position:relative;text-align:center;padding:0 0 60px;overflow:hidden}
.hero .band{--bh:60px;margin-top:14px}
.hero-in{padding:26px 22px 0}
.be-top{font:400 15px/1.4 var(--disp);color:var(--red);letter-spacing:.04em;opacity:0;animation:fade 1.2s .3s forwards}
.frame-wrap{position:relative;width:min(68vw,300px);margin:26px auto 0;opacity:0;animation:fade 1.4s .5s forwards}
.frame{position:relative;aspect-ratio:4/5;border-radius:50% 50% 50% 50%/42% 42% 58% 58%;overflow:hidden;background:var(--white);box-shadow:0 0 0 6px var(--white),0 0 0 7px var(--thread),0 30px 50px -30px rgba(43,29,26,.5)}
.frame img{width:100%;height:100%;object-fit:cover}
.frame .ph{position:absolute;inset:0;box-shadow:inset 0 0 0 10px var(--white),inset 0 0 0 11px rgba(165,29,36,.25);border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);
  background:radial-gradient(closest-side,rgba(165,29,36,.06),transparent),var(--white)}
.frame .ph svg{width:46%}
.frame .ph small{font:600 10px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase}
/* рушнік, перекинутый через рамку */
.drape{position:absolute;top:8%;width:38px;height:94%;z-index:2;filter:drop-shadow(0 6px 6px rgba(43,29,26,.18))}
.drape.l{left:-22px;transform:rotate(4deg);transform-origin:top center}
.drape.r{right:-22px;transform:rotate(-4deg);transform-origin:top center}
.drape svg{width:100%;height:100%;display:block}
.drape{animation:sway 5s ease-in-out infinite alternate}
.drape.r{animation-delay:-2.5s}
.names{font:400 clamp(46px,13.5vw,84px)/1.02 var(--disp);margin-top:34px;letter-spacing:-.01em;opacity:0;animation:fade 1.4s .9s forwards}
.names .amp{display:block;font-size:.42em;color:var(--red);margin:4px 0}
.date{display:inline-grid;grid-template-columns:auto auto auto;align-items:center;gap:14px;margin-top:22px;opacity:0;animation:fade 1.2s 1.2s forwards}
.date .n{font:400 46px/1 var(--disp);color:var(--red)}
.date .t{font:500 12px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-align:left}
.date .t:first-child{text-align:right}
.date i{display:block;width:1px;height:46px;background:var(--thread);margin:0 auto}
.place{margin-top:18px;opacity:0;animation:fade 1.2s 1.4s forwards}
.place b{display:block;font:400 22px/1.3 var(--disp)}
.place span{color:var(--muted);font-size:15px}

/* sections */
section.s{padding:70px 0 0;position:relative}
.sh{text-align:center;margin-bottom:30px}
.sh svg{width:58px;height:58px;display:block;margin:0 auto 12px}
.sh .be{display:block;font:400 15px/1.3 var(--disp);color:var(--red);margin-bottom:6px}
.sh h2{font:400 clamp(32px,9vw,46px)/1.1 var(--disp)}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.1,1)}
.rv.in{opacity:1;transform:none}
.card{background:var(--white);padding:28px 22px;position:relative;box-shadow:0 20px 40px -32px rgba(43,29,26,.45)}
.card::after{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(165,29,36,.35);pointer-events:none}
.words p{font-size:18px;line-height:1.7}
.words p+p{margin-top:.8em}
.words .sig{font:400 26px/1.2 var(--disp);color:var(--red);margin-top:18px}
.be-quote{text-align:center;margin-top:22px;font:400 19px/1.45 var(--disp);color:var(--deep)}
.be-quote small{display:block;font:600 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count div{background:var(--white);padding:16px 2px 12px;text-align:center;position:relative}
.count div::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(165,29,36,.35)}
.count b{display:block;font:400 clamp(30px,9vw,44px)/1 var(--disp);color:var(--red);font-variant-numeric:tabular-nums}
.count small{font:500 11px/1 var(--sans);color:var(--muted)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;background:var(--red);color:#fff;border:0;text-decoration:none;cursor:pointer;font:600 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;transition:.3s;margin-top:22px}
.btn svg{width:17px;height:17px}
.btn.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn:hover{background:var(--deep);color:#fff;box-shadow:none}

/* timeline на рушнике */
.tl{position:relative;padding-left:64px}
.tl .spine{position:absolute;left:8px;top:0;bottom:0;width:36px;background:var(--white);box-shadow:0 0 0 1px var(--thread)}
.tl .spine svg{width:100%;height:100%;display:block}
.tl li{list-style:none;position:relative;padding:4px 0 26px}
.tl li::before{content:"";position:absolute;left:-30px;top:14px;width:12px;height:12px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 0 4px var(--linen)}
.tl time{font:400 26px/1 var(--disp);color:var(--red)}
.tl h3{font:600 17px/1.3 var(--sans);margin-top:6px}
.tl p{color:var(--muted);font-size:15px;line-height:1.5;margin-top:2px}

/* place */
.venue{text-align:center}
.venue .art{display:block;width:100%;margin-bottom:18px}
.venue h3{font:400 28px/1.15 var(--disp)}
.venue .addr{margin-top:8px}
.venue .how{color:var(--muted);font-size:15px;margin-top:10px}

/* dress */
.dress p{text-align:center;max-width:540px;margin:0 auto}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px;margin-top:24px}
.sw figure{text-align:center}
.sw i{display:block;aspect-ratio:1;position:relative;box-shadow:0 10px 18px -12px rgba(43,29,26,.5)}
.sw i::after{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(255,255,255,.55)}
.sw i.light::after{border-color:rgba(165,29,36,.35)}
.sw figcaption{font:500 12.5px/1.3 var(--sans);margin-top:8px;color:var(--muted)}

/* gifts */
.gifts{display:grid;gap:16px}
.gifts h3{font:400 24px/1.2 var(--disp);color:var(--red);margin-bottom:6px}

/* RSVP */
#rsvp{display:grid;gap:20px}
.f-label{display:block;font:600 11px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.f-input{width:100%;border:1.5px solid var(--thread);background:#fff;padding:13px 14px;font:400 16px/1.4 var(--sans);color:var(--deep);outline:0;border-radius:0;resize:vertical}
.f-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(165,29,36,.12)}
.f-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f-seg label{position:relative;cursor:pointer}
.f-seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.f-seg span{display:block;text-align:center;padding:14px 6px;border:1.5px solid var(--thread);background:#fff;font:500 14.5px/1.2 var(--sans);transition:.2s}
.f-seg input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.f-step{display:inline-flex;align-items:center;border:1.5px solid var(--thread);background:#fff}
.f-step-btn{width:48px;height:46px;border:0;background:transparent;color:var(--red);font:500 22px/1 var(--sans);cursor:pointer}
.f-step-val{min-width:46px;text-align:center;font:400 24px/46px var(--disp);border-left:1.5px solid var(--thread);border-right:1.5px solid var(--thread)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip span{display:inline-block;padding:10px 14px;border:1.5px solid var(--thread);background:#fff;font:500 13.5px/1 var(--sans);cursor:pointer;transition:.2s}
.chip input:checked+span{border-color:var(--red);color:var(--red);background:#fdf3f2}
.f-yes{display:grid;gap:20px}.f-yes.off{display:none}
.f-submit{padding:18px;border:0;background:var(--red);color:#fff;font:600 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.f-submit:disabled{opacity:.6}
.f-error{color:var(--red);font-weight:500;font-size:14px}
.f-note{text-align:center;font-size:13px;color:var(--muted)}
.thanks{display:none;text-align:center;padding:10px 0}
.thanks.on{display:block;animation:fade .9s}
.thanks svg{width:84px;height:84px;display:block;margin:0 auto 10px}
.thanks .big{font:400 40px/1.1 var(--disp);color:var(--red)}
.thanks .be{font:400 16px/1.3 var(--disp);color:var(--muted);margin-top:4px}
.thanks p{margin-top:12px}
.thanks button{margin-top:14px;border:0;background:none;color:var(--muted);font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;cursor:pointer}

/* contacts */
.people{display:grid;gap:16px}
.person{text-align:center}
.person h3{font:400 26px/1.15 var(--disp)}
.person .role{font-size:13px;color:var(--muted)}
.person .tel{display:inline-block;margin-top:4px;color:var(--red);text-decoration:none;font-weight:500}
.msg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;position:relative;z-index:1}
.msg a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;background:var(--linen);text-decoration:none;font:500 11px/1 var(--sans);color:var(--deep);transition:.2s}
.msg a svg{width:22px;height:22px;color:var(--red)}
.msg a:hover{background:var(--red);color:#fff}.msg a:hover svg{color:#fff}

footer{margin-top:80px;text-align:center;position:relative}
footer .names{opacity:1;animation:none;font-size:clamp(40px,11vw,64px);margin-top:28px}
footer p{color:var(--muted);margin-top:8px}
footer > svg:first-child{width:64px;height:64px;display:block;margin:0 auto}
.fringe{display:block;width:100%;height:110px;margin-top:40px}

@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sway{from{rotate:-1.2deg}to{rotate:1.2deg}}
@keyframes spin{from{transform:rotate(-90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.sh svg.in-star{animation:spin 1.4s cubic-bezier(.2,.7,.1,1) both}
@media (min-width:900px){
  .wrap{max-width:820px}
  .gifts{grid-template-columns:1fr 1fr}
  .people{grid-template-columns:1fr 1fr}
  .frame-wrap{width:260px}
  .hero .names{font-size:72px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.be-top,.frame-wrap,.names,.date,.place,.rv{opacity:1!important;transform:none!important}.band.stitch{clip-path:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* =====================================================================
   CONFIG — ВСЕ ДАННЫЕ ПАРЫ. Конструктор подставляет сюда свои значения.
   Схема описана в README.md. Пустая строка/пустой массив = блок скрыт.
   ===================================================================== */
const CONFIG = {
  template: "rushnik",
  siteId: "",
  couple: { partner1: "Алеся", partner2: "Андрей", monogram: "А·А" },
  date: { start: "2027-06-26T14:00:00+03:00", end: "2027-06-27T00:00:00+03:00", timezone: "Europe/Minsk" },
  location: {
    city: "Гродненский р-н",
    venueType: "Усадьба",
    venue: "Сядзіба «Ліпавы гай»",
    address: "аг. Каменка, ул. Садовая, 21, Гродненский р-н",
    coords: [53.6694, 23.8131],
    mapUrl: "",
    howToGet: "25 минут от центра Гродно. Для гостей будет трансфер от Дворца бракосочетания в 12:45 и обратно в 23:30."
  },
  photo: { hero: "", caption: "Фото пары" },
  texts: {
    beTop: "Запрашаем на вяселле",
    intro: [
      "Наши бабушки вышивали рушники к свадьбе внуков задолго до того, как мы познакомились. Теперь пришло время развернуть их.",
      "Мы приглашаем вас на день, в котором будет всё, что мы любим: старый липовый сад, каравай, живые цимбалы, долгий стол и танцы до ночи."
    ],
    signature: "Алеся и Андрей",
    belarusian: "Каханне — гэта калі разам і ў радасці, і ў працы.",
    closing: "Да сустрэчы! До встречи!"
  },
  program: [
    { time: "13:30", title: "Сбор гостей и каравай", text: "Встречаем хлебом-солью у ворот усадьбы" },
    { time: "14:00", title: "Выездная церемония", text: "В липовой аллее, под звуки цимбал" },
    { time: "15:00", title: "Фуршет и фотосессия", text: "Сад, качели, лимонад и игристое" },
    { time: "16:00", title: "Свадебный стол", text: "Блюда белорусской кухни от шефа усадьбы" },
    { time: "20:00", title: "Танцы", text: "Живая музыка и диджей" },
    { time: "22:30", title: "Торт и снятие фаты", text: "Старинный обряд — тихо и красиво" }
  ],
  gifts: {
    text: "Будем благодарны за подарки в конвертах — они помогут нам достроить дом под Гродно. Пусть у него будут ваши кирпичики.",
    flowers: "Пожалуйста, без живых цветов: вместо букета подарите нам семена или саженец — посадим ваш сад."
  },
  dressCode: {
    title: "Лён и молоко",
    text: "Будем рады натуральным тканям и светлым тонам. Детали с вышивкой или красный акцент — особенно приветствуются.",
    colors: [
      { name: "Малако", hex: "#f6f1e7" }, { name: "Лён", hex: "#d9ccb4" }, { name: "Чырвоны", hex: "#a51d24" },
      { name: "Мох", hex: "#6f7351" }, { name: "Чорны", hex: "#2b1d1a" }
    ]
  },
  contacts: [
    { name: "Алеся", role: "Невеста", phone: "+375 29 000-00-31", telegram: "" },
    { name: "Марына", role: "Сестра невесты, отвечает на вопросы", phone: "+375 44 000-00-32", telegram: "" }
  ],
  rsvp: {
    endpoint: "",            // URL вашего бэкенда (POST JSON). Пусто = демо-режим
    deadline: "2027-05-26",
    maxGuests: 5,
    drinks: ["Вино", "Игристое", "Наливка", "Крепкое", "Без алкоголя"]
  },
  theme: { linen: "#f1eadc", white: "#fbf8f2", red: "#a51d24", deep: "#2b1d1a" }
};
/* ==========================================================================
   WEDDING CORE v1 — общий движок для всех шаблонов (вставляется при сборке).
   Ничего здесь не меняйте под конкретную пару: все данные — в CONFIG выше.
   ========================================================================== */
const W = (() => {
  const C = CONFIG;
  const TZ = (C.date && C.date.timezone) || 'Europe/Minsk';
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MONTHS_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const MONTHS_BE = ['студзеня','лютага','сакавіка','красавіка','мая','чэрвеня','ліпеня','жніўня','верасня','кастрычніка','лістапада','снежня'];
  const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const plural = (n, f) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; };

  /* Части даты в часовом поясе свадьбы (Минск), независимо от пояса гостя */
  function parts(iso) {
    const d = new Date(iso);
    const p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false })
      .formatToParts(d).forEach(x => p[x.type] = x.value);
    const m = +p.month - 1;
    const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);
    return {
      date: d, day: +p.day, dd: p.day, month: m, mm: p.month, year: +p.year,
      time: `${p.hour === '24' ? '00' : p.hour}:${p.minute}`,
      monthGen: MONTHS_GEN[m], monthNom: MONTHS_NOM[m], monthBe: MONTHS_BE[m], weekday: WEEKDAYS[wd],
      dotted: `${p.day}.${p.month}.${p.year}`,
      long: `${+p.day} ${MONTHS_GEN[m]} ${p.year}`
    };
  }
  const start = () => parts(C.date.start);

  /* Обратный отсчёт: cb({d,h,m,s,done}) раз в секунду */
  function countdown(cb) {
    const target = new Date(C.date.start).getTime();
    const tick = () => {
      let diff = Math.max(0, target - Date.now());
      const done = diff === 0;
      const d = Math.floor(diff / 864e5); diff -= d * 864e5;
      const h = Math.floor(diff / 36e5); diff -= h * 36e5;
      const m = Math.floor(diff / 6e4); diff -= m * 6e4;
      cb({ d, h, m, s: Math.floor(diff / 1000), done });
    };
    tick(); return setInterval(tick, 1000);
  }

  /* Ссылка на Яндекс.Карты: берём mapUrl, иначе строим поиск по адресу */
  function mapUrl() {
    const L = C.location || {};
    if (L.mapUrl) return L.mapUrl;
    if (L.coords) return `https://yandex.by/maps/?pt=${L.coords[1]},${L.coords[0]}&z=15&l=map`;
    return `https://yandex.by/maps/?text=${encodeURIComponent([L.city, L.address].filter(Boolean).join(', '))}`;
  }

  /* Файл .ics для «Добавить в календарь» */
  function icsDate(iso) { return new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  function downloadICS() {
    const L = C.location || {};
    const title = `Свадьба: ${C.couple.partner1} и ${C.couple.partner2}`;
    const endIso = C.date.end || new Date(new Date(C.date.start).getTime() + 8 * 36e5).toISOString();
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//wedding-site//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:${icsDate(C.date.start)}-${(C.couple.partner1 + C.couple.partner2).length}@wedding-site`,
      `DTSTAMP:${icsDate(new Date().toISOString())}`,
      `DTSTART:${icsDate(C.date.start)}`, `DTEND:${icsDate(endIso)}`,
      `SUMMARY:${title}`,
      `LOCATION:${[L.venue, L.address, (L.address || '').includes(L.city || '#') ? '' : L.city].filter(Boolean).join(', ').replace(/,/g, '\\,')}`,
      `DESCRIPTION:${('Ждём вас! Карта: ' + mapUrl()).replace(/,/g, '\\,')}`,

  ${band(45)}
  ${on('place') ? sec('Дзе святкуем', 'Место торжества', `<div class="card venue rv">${on('placePhoto') ? (L.photo ? `<img class="aiv-place" alt="" src="${esc(L.photo)}" style="width:100%;aspect-ratio:16/10;object-fit:cover">` : venueArt) : ''}<span class="kick">${esc(L.venueType || '')}</span><h3 style="margin-top:6px">${esc(L.venue)}</h3><p class="addr">${esc(L.address)}</p>${L.howToGet ? `<p class="how">${esc(L.howToGet)}</p>` : ''}
     ${on('map') ? `<a class="btn" href="${esc(mapUrl())}" target="_blank" rel="noopener">${icons.map}Открыть на карте</a>` : ''}</div>`, 'place') : ''}

  ${on('dress') && C.dressCode ? sec('Дрэс-код', 'Дресс-код', `<div class="dress"><p class="rv"><b style="font-family:var(--disp);font-weight:400;font-size:22px;display:block;color:var(--red)">${esc(C.dressCode.title || '')}</b>${esc(C.dressCode.text)}</p>
     <div class="sw">${(C.dressCode.colors || []).map(c => `<figure class="rv"><i class="${isLight(c.hex) ? 'light' : ''}" style="background:${esc(c.hex)}"></i></figure>`).join('')}</div></div>`) : ''}

  ${(on('gifts') && C.gifts && C.gifts.text) || (on('flowers') && C.gifts && C.gifts.flowers) ? sec('Падарункі', 'Пожелания', `<div class="gifts">${on('gifts') && C.gifts.text ? `<div class="card rv"><h3>О подарках</h3><p>${esc(C.gifts.text)}</p></div>` : ''}${on('flowers') && C.gifts.flowers ? `<div class="card rv"><h3>О цветах</h3><p>${esc(C.gifts.flowers)}</p></div>` : ''}</div>`) : ''}

  ${band(45)}
  ${on('rsvp') ? sec('Будете с нами', 'Анкета гостя', `<div class="card rv"><form id="rsvp"></form><div class="thanks" id="thanks" aria-live="polite">${star()}<div class="big">Спасибо!</div><p id="thanksText"></p><button type="button" id="again">Изменить ответ</button></div></div>`, 'rsvp-section') : ''}

  ${on('contacts') && C.contacts && C.contacts.length ? sec('Кантакты', 'Контакты', `<div class="people">${C.contacts.map(c => `<div class="card person rv"><h3>${esc(c.name)}</h3><div class="role">${esc(c.role || '')}</div><a class="tel" href="tel:+${String(c.phone).replace(/\D/g, '')}">${esc(c.phone)}</a><div class="msg">${contactLinks(c).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener" aria-label="${l.label}: ${esc(c.name)}">${icons[l.type]}${l.label === 'Позвонить' ? 'Звонок' : l.label}</a>`).join('')}</div></div>`).join('')}</div>`) : ''}

  <footer>${star()}${on('names') ? `<div class="names">${esc(C.couple.partner1)} <span style="color:var(--red)">і</span> ${esc(C.couple.partner2)}</div>` : ''}<p>${esc(T.closing || '')}<br>${d.day} ${esc(d.monthBe)} ${d.year}</p>
    <svg class="fringe" preserveAspectRatio="none" viewBox="0 0 400 110" aria-hidden="true"><rect width="400" height="64" fill="#fbf8f2"/><rect y="6" width="400" height="52" fill="url(#pBand)" transform="scale(1 .7)"/><g stroke="#a51d24" stroke-width="1.3">${Array.from({ length: 80 }, (_, i) => `<path d="M${2.5 + i * 5} 64v${36 + (i % 3) * 4}"/>`).join('')}</g></svg></footer>`;

  document.getElementById('app').innerHTML = html;

  const forms = { d: ['день','дня','дней'], h: ['час','часа','часов'], m: ['минута','минуты','минут'], s: ['секунда','секунды','секунд'] };
  window.__aivTimer = countdown(t => ['d','h','m','s'].forEach(k => { const b = $(`[data-k=${k}]`); if (b) { b.textContent = t[k]; $(`[data-l=${k}]`).textContent = plural(t[k], forms[k]); } }));
  $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  bindRSVP(form, data => { form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on'); });
  $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; });
  requestAnimationFrame(() => $('.hero .band').classList.add('in'));
  reveal();
  window.scrollTo(0, keepY);
  if (keepSlide >= 0 && window.STORIES && window.STORIES.go) window.STORIES.go(keepSlide, true);
};
window.aivPaint();
</script>
</body>
</html>
