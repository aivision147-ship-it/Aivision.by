:root{--bg:#c9d3c0;--panel:#fbfbf7;--ink:#28352a;--muted:#4d5c4e;--acct:#465d43;--btn:#4d6649;--btnt:#ffffff;--line:rgba(77,102,73,.3);--namec:#3e573b;--ph:#fbfbf7;--err:#a11d1d;--fd:"AIV Great Vibes",cursive;--fh2:"AIV Playfair Display",Georgia,serif;--fh:"AIV Playfair Display",Georgia,serif;--fb:"AIV Lora",Georgia,serif;--fl:"AIV Montserrat",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
*{font-variant-numeric:lining-nums!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip;background:var(--bg)}
body{color:var(--ink);font:400 var(--fs,18px)/1.65 var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased;background:#c9d3c0;font-variant-numeric:lining-nums}
a{color:inherit}
svg{display:block}
.wrap{max-width:640px;margin:0 auto;padding:0 24px;position:relative}
.lbl{font:var(--lw,600) 11.5px/1.6 var(--fl);letter-spacing:.22em;text-transform:uppercase;color:var(--acct)}
.orn{width:min(84%,330px);height:auto;margin:0 auto;overflow:visible}
.orn.sm{width:200px}.orn.film{width:100%;max-width:none}
.dv{width:160px;height:30px;margin:0 auto 14px}
/* имена: скриптовые шрифты — без капса и разрядки */
.nm{display:block;font:var(--nw,400) var(--nsize,clamp(52px,15vw,96px))/1.12 var(--fd);color:var(--namec,var(--ink));white-space:nowrap;padding:0 .12em}
.names.caps .nm{text-transform:uppercase;letter-spacing:var(--nls,.06em)}

  const sec = (title, inner, id, alt) => { n++; return `<section class="s ${alt ? 'alt' : ''}" ${id ? `id="${id}"` : ''}><div class="wrap"><div class="sh rv">${D.numbered ? `<span class="no">${String(n).padStart(2, '0')}</span>` : ''}${D.numbered ? '' : dv}<h2>${esc(title)}</h2></div>${inner}</div></section>`; };
  const lead = Array.isArray(T.lead) ? T.lead : [T.lead || ''];
  const ph = C.photo || {}, showPhoto = !!ph.hero || ph.placeholder;
  const notes = [
    ...(on('gifts') && C.gifts && C.gifts.text ? [{ title: 'Подарки', text: C.gifts.text }] : []),
    ...(on('flowers') && C.gifts && C.gifts.flowers ? [{ title: 'Цветы', text: C.gifts.flowers }] : []),
    ...((C.details || []).filter(x => x && x.text && (x.title !== 'Дети' || on('kids')) && (x.title !== 'Фотосъёмка' || on('shoot'))))
  ];
  const dc = C.dressCode || {}, R = C.rsvp || {}, prog = C.program || [];
  const dl = R.deadline ? parts(R.deadline + 'T12:00:00+03:00').long : '';
  const namesH = cls => on('names') ? `<h1 class="names ${nc} ${cls || ''}" aria-label="${esc(P1)} и ${esc(P2)}"><span class="nm">${esc(P1)}</span><span class="amp">${esc(D.amp || 'и')}</span><span class="nm">${esc(P2)}</span></h1>` : '';
  const whenH = on('date') ? `<p class="when date"><span class="d">${esc(d.long)} года</span><span class="t">${esc(d.weekday)} · ${d.time}${on('place') && L.city ? ` · ${esc(L.city)}` : ''}</span></p>` : '';
  const phBox = (txt) => `<div class="phl">${esc(txt || 'Здесь будет ваше фото')}</div>`;
  let hero;
  if (D.hero === 'editorial') hero = `<header class="hero" id="hero"><div class="mast fi d1"><span>${esc(D.mast || 'Свадебный выпуск')}</span><span>№ ${d.dd}·${d.mm}</span><span>${d.year}</span></div><div class="hero-in"><p class="lead fi d2">${lead.map(esc).join(' ')}</p><div class="fi d3">${namesH()}</div><div class="fi d4">${whenH}</div></div></header>`;
  else if (D.hero === 'polaroid') hero = `<header class="hero" id="hero"><div class="hero-in"><div class="pol fi d1"><div class="shot frame-wrap">${phBox()}${ph.hero ? `<img src="${esc(ph.hero)}" alt="">` : ''}</div><div class="nm">${esc(P1)} + ${esc(P2)}</div></div><p class="lead fi d2">${lead.map(esc).join('<br>')}</p><div class="fi d3">${D.top || ''}</div><div class="fi d4">${whenH}<a class="scroll" href="#words">Листайте ниже</a></div></div></header>`;
  else if (D.hero === 'split') hero = `<header class="hero" id="hero"><div class="hero-grid"><div class="fi d1"><div class="archph frame-wrap">${phBox()}${ph.hero ? `<img src="${esc(ph.hero)}" alt="">` : ''}</div></div><div class="hero-in"><p class="lead fi d2">${lead.map(esc).join('<br>')}</p><div class="fi d3">${namesH()}</div><div class="fi d4">${D.top || ''}${whenH}</div></div></div></header>`;
  else if (D.hero === 'film') hero = `<header class="hero" id="hero"><div class="fi d1" style="width:100%">${D.top}</div><div class="hero-in"><p class="lead fi d2">${lead.map(esc).join('<br>')}</p><div class="fi d3">${namesH()}</div><div class="fi d4">${whenH}</div></div><div style="width:100%;transform:scaleY(-1)">${D.top}</div></header>`;
  else hero = `<header class="hero" id="hero"><div class="hero-in"><div class="fi d1">${D.top || ''}</div><p class="lead fi d2">${lead.map(esc).join('<br>')}</p><div class="fi d3">${namesH()}</div><div class="fi d4">${whenH}${on('rsvp') && dl ? `<p class="muted" style="margin-top:14px;font-style:italic">Просим ответить до ${esc(dl)} года</p>` : ''}</div></div></header>`;

  /* календарь месяца: неделя с понедельника */
  const cal = () => { const y = d.year, m = d.month, first = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7, days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    let g = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(first);
    for (let i = 1; i <= days; i++) g += `<span class="${i === d.day ? 'on ' + (D.calHeart ? 'heart' : '') : ''}">${i}</span>`;
    return `<div class="cal rv"><p class="mh">${esc(d.monthNom)} ${y}</p><div class="g">${g}</div></div>`; };
  const mapArt = `<div class="mapcard rv"><svg viewBox="0 0 420 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="currentColor" opacity=".28" style="color:var(--ink)"><path d="M0 40H420M0 110H420M90 0V150M300 0V150" stroke-width="10"/><path d="M0 75C120 60 260 100 420 70M180 0L230 150" stroke-width="4"/></g><path d="M210 30a20 20 0 0 1 20 20c0 15-20 38-20 38s-20-23-20-38a20 20 0 0 1 20-20Z" fill="var(--btn)"/><circle cx="210" cy="50" r="7" fill="var(--btnt)"/></svg></div>`;

  const html = `${hero}
  ${showPhoto && on('photo') ? `<section class="s" id="photo"><div class="wrap"><figure class="photo frame-wrap rv"><div class="in">${phBox(ph.caption)}${ph.hero ? `<img src="${esc(ph.hero)}" alt="${esc(P1)} и ${esc(P2)}">` : ""}</div></figure></div></section>` : ''}
  ${on('words') && T.intro && T.intro.length ? sec(T.introTitle || 'Дорогие гости', `${T.intro.map(p => `<p class="p rv">${esc(p)}</p>`).join('')}${T.signature ? `<p class="sig ${nc} rv">${esc(T.signature)}</p>` : ''}`, 'words') : ''}
  ${(on('date') || on('timer')) && C.date && C.date.start ? sec('Дата и время', `${on('date') ? cal() : ''}${on('date') ? `<p class="bigtime rv">${esc(cap(d.weekday))}, ${esc(d.long)} года, в ${d.time}</p>` : ''}
     ${on('timer') ? `<div class="count rv">${['d','h','m','s'].map(k => `<div><b data-k="${k}">0</b><small data-l="${k}"></small></div>`).join('')}</div>` : ''}
     <p class="center muted rv" id="cdone" hidden>Торжество состоялось. Благодарим, что были с нами!</p>
     <div class="center rv"><button class="btn" id="ics">${icons.calendar}Добавить в календарь</button></div>`, 'when', true) : ''}
  ${on('program') && prog.length ? sec('Программа дня', `<ol class="prog">${prog.map(p => `<li class="rv"><time>${esc(p.time)}</time><i></i><div><b>${esc(p.title)}</b>${p.text ? `<small>${esc(p.text)}</small>` : ''}</div></li>`).join('')}</ol>`, 'program') : ''}
  ${on('place') && (L.venue || L.city) ? sec('Место проведения', `<div class="venue rv">${on('placePhoto') && L.photo ? `<img class="aiv-place" alt="" src="${esc(L.photo)}">` : ''}${L.venueType ? `<p class="lbl">${esc(L.venueType)}</p>` : ''}${L.venue ? `<h3>${esc(L.venue)}</h3>` : ''}<p class="addr">${esc([L.address, L.city].filter(Boolean).join(', '))}</p>${L.howToGet ? `<p class="how">${esc(L.howToGet)}</p>` : ''}</div>${mapArt}<div class="center rv">${on('map') ? `<a class="btn" href="${esc(mapUrl())}" target="_blank" rel="noopener">${icons.map}Открыть карту</a>` : ''}</div>`, 'place', true) : ''}
  ${on('dress') && (dc.title || dc.text || (dc.colors && dc.colors.length)) ? sec('Дресс-код', `<div class="rv">${dc.title ? `<p class="dcode">${esc(dc.title)}</p>` : ''}${dc.text ? `<p class="p">${esc(dc.text)}</p>` : ''}${dc.colors && dc.colors.length ? `<div class="sw">${dc.colors.map(c => `<figure><i style="background:${esc(c.hex)}"></i>${/^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(c.name || '').trim()) ? '' : '<figcaption>' + esc(c.name) + '</figcaption>'}</figure>`).join('')}</div>` : ''}</div>`, 'dress') : ''}
  ${notes.length ? sec('Пожелания', `<div class="notes gifts">${notes.map(x => `<div class="rv card"><h3>${esc(x.title || '')}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`, 'wishes', true) : ''}
  ${on('rsvp') && R.enabled !== false ? sec('Анкета гостя', `<p class="p rv" style="margin-bottom:26px">${dl ? `Просим подтвердить Ваше присутствие до ${esc(dl)} года` : 'Просим подтвердить Ваше присутствие'}</p><div class="rbox rv"><form id="rsvp"></form><div class="thanks" id="thanks" aria-live="polite"><div class="big">Спасибо!</div><p id="thanksText"></p><button type="button" id="again">Изменить ответ</button></div></div>`, 'rsvp-section') : ''}
  ${on('contacts') && C.contacts && C.contacts.length ? sec('Контакты', `<div class="people">${C.contacts.map(c => `<div class="person rv"><p class="lbl">${esc(c.role || '')}</p><h3>${esc(c.name)}</h3>${c.phone ? `<a class="tel" href="tel:+${String(c.phone).replace(/\D/g, '')}">${esc(c.phone)}</a>` : ''}<div class="msg">${contactLinks(c).filter(l => l.type !== 'phone').map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener" aria-label="${l.label}: ${esc(c.name)}">${icons[l.type] || ''}${l.label}</a>`).join('')}</div></div>`).join('')}</div>`, 'contacts', true) : ''}
  <footer class="rv"><div class="wrap">${D.top || ''}${T.closing ? `<p class="bye">${esc(T.closing)}</p>` : ''}<p class="fn ${nc}">${esc(P1)} ${esc(D.amp || 'и')} ${esc(P2)}</p><p class="fd">${esc(d.dotted)} · ${esc(L.city || '')}</p></div></footer>`;
  document.getElementById('app').innerHTML = html;

  function fitNames() { $$('.names .nm').forEach(el => { el.style.fontSize = ''; const box = el.parentElement.clientWidth, w = el.scrollWidth; if (w > box) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * box / w * .96) + 'px'; }); }
  if (window.__aivFit) removeEventListener('resize', window.__aivFit);
  window.__aivFit = fitNames;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitNames); addEventListener('resize', fitNames); fitNames();
  const forms = { d: ['день','дня','дней'], h: ['час','часа','часов'], m: ['минута','минуты','минут'], s: ['секунда','секунды','секунд'] };
  if ($('.count')) window.__aivTimer = countdown(t => { if (t.done) { $('.count').hidden = true; $('#cdone').hidden = false; return; }
    ['d','h','m','s'].forEach(k => { const b = $(`[data-k=${k}]`); if (b) { b.textContent = t[k]; $(`[data-l=${k}]`).textContent = plural(t[k], forms[k]); } }); });
  if ($('#ics')) $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  if (form) { bindRSVP(form, data => { form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on'); });
    const note = form.querySelector('.f-note'); if (note) note.remove();
    $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; }); }
  reveal();
  if (keepY) window.scrollTo(0, keepY);
};
window.aivPaint();
</script>
</body>
</html>
