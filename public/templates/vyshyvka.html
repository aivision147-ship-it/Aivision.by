/* HERO — паштоўка ў вышыванай рамцы */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden;
  padding:calc(var(--c,2.3px)*31) calc(var(--c,2.3px)*29) calc(var(--c,2.3px)*33)}
.hero .xframe{position:absolute;inset:0;z-index:1;pointer-events:none}
.hero .xframe svg{width:100%;height:100%}
.xframe.draw{clip-path:inset(0 0 100% 0);animation:drawY 2.4s steps(36,end) .15s forwards}
@keyframes drawY{to{clip-path:inset(0 0 0 0)}}
.hero-in{position:relative;z-index:2;max-width:620px;margin:0 auto;width:100%}
.h-title{font:400 clamp(40px,11.6vw,64px)/1.08 var(--script);color:var(--ink);opacity:0;animation:fade 1.3s .4s forwards}
.h-title span{display:block}
.names{margin-top:4px;opacity:0;animation:fade 1.4s .8s forwards}
.names .nm{display:block;font:400 clamp(54px,16.5vw,100px)/1.12 var(--script);white-space:nowrap;padding:0 .12em}
.names .p1{color:var(--red)}
.names .and{display:block;font:400 clamp(34px,9vw,52px)/.8 var(--script);color:var(--ink);margin:-.02em 0 -.06em}
.doves{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0;margin:6px -8px 0;max-width:460px;opacity:0;animation:fade 1.4s 1.1s forwards}
.dv{width:100%;max-width:170px}
.dv.l{justify-self:end;animation:float 5s ease-in-out infinite alternate}
.dv.r{justify-self:start;transform:scaleX(-1);animation:floatR 5s ease-in-out -2.5s infinite alternate}
.hrt{width:clamp(66px,19vw,100px);margin-top:14%}
.hrt svg{width:100%;height:auto;animation:beat 3.2s ease-in-out infinite}
.scroll{display:block;width:min(66%,270px);height:auto;margin:8px auto 0}
.h-date{font:600 clamp(24px,6.7vw,34px)/1.2 var(--serif);margin-top:12px;opacity:0;animation:fade 1.2s 1.4s forwards;font-variant-numeric:lining-nums}
.h-city{font:600 clamp(21px,5.6vw,28px)/1.2 var(--serif);margin-top:14px;opacity:0;animation:fade 1.2s 1.6s forwards}
.h-time{display:block;font:500 15px/1.3 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.div{display:block;width:min(52%,220px);height:auto;margin:10px auto}
.div.sm{width:min(36%,150px)}
.dv,.hrt svg{will-change:transform}

/* sections */
section.s{padding:64px 0 0;position:relative;overflow-x:clip}
.sh{text-align:center;margin-bottom:26px}
.sh .ttl{font:400 clamp(44px,12.4vw,62px)/1.1 var(--script);color:var(--ink);padding:0 .1em}
.sh .ttl em{font-style:normal;color:var(--red)}
.sh .div{margin-top:4px}
.kick{display:block;font:600 13px/1.3 var(--serif);letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.1,1)}
.rv.in{opacity:1;transform:none}
.card{background:rgba(251,248,244,.86);padding:30px 24px;position:relative;box-shadow:0 18px 40px -30px rgba(60,30,30,.5)}
.card::after{content:"";position:absolute;inset:7px;border:1px solid rgba(179,32,42,.22);pointer-events:none}
.center{text-align:center}
.band{display:block;width:100%;margin:60px 0 0;position:relative;z-index:1}
.band svg{margin:0 auto}
.band.stitch{clip-path:inset(0 100% 0 0);transition:clip-path 2.2s steps(40,end)}
.band.stitch.in{clip-path:inset(0 0 0 0)}

/* photo */
.photo{position:relative;width:min(76vw,340px);margin:0 auto;aspect-ratio:4/5}
.photo .ph,.photo img{position:absolute;inset:calc(var(--pc,2px)*9);width:auto;height:auto;object-fit:cover;background:var(--paper)}
.photo img{width:calc(100% - var(--pc,2px)*18);height:calc(100% - var(--pc,2px)*18)}
.photo .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font:600 12px/1.4 var(--serif);letter-spacing:.2em;text-transform:uppercase}
.photo .ph svg{width:38%;height:auto}
.photo .pfr{position:absolute;inset:0;z-index:2;pointer-events:none}
.photo .pfr svg{width:100%;height:100%}

/* words */
.words p{font-size:20px;line-height:1.62;text-align:center}
.words p+p{margin-top:.75em}
.words .lead{font:600 22px/1.4 var(--serif);color:var(--red);margin-bottom:.6em}
.words .sig{font:400 40px/1.2 var(--script);color:var(--red);margin-top:16px}
.quote{text-align:center;margin-top:26px;font:italic 500 22px/1.45 var(--serif)}
.quote small{display:block;font:600 12px/1 var(--serif);font-style:normal;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count div{background:rgba(251,248,244,.86);padding:16px 2px 12px;text-align:center;position:relative}
.count div::after{content:"";position:absolute;inset:4px;border:1px solid rgba(179,32,42,.22)}
.count b{display:block;font:600 clamp(32px,9.5vw,46px)/1 var(--serif);color:var(--red);font-variant-numeric:tabular-nums lining-nums}
.count small{font:600 14px/1 var(--serif);color:var(--muted)}
.count-done{text-align:center;font:500 21px/1.5 var(--serif)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;background:var(--red);color:#fff;border:0;text-decoration:none;cursor:pointer;font:700 14px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;transition:.3s;margin-top:22px}
.btn svg{width:17px;height:17px}
.btn.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn:hover{background:var(--ink);color:#fff;box-shadow:none}

/* programme */
.tl{list-style:none;position:relative;max-width:520px;margin:0 auto}
.tl::before{content:"";position:absolute;left:84px;top:10px;bottom:10px;border-left:2px dashed rgba(179,32,42,.45)}
.tl li{display:grid;grid-template-columns:70px 1fr;gap:30px;padding:0 0 26px;position:relative}
.tl li::before{content:"";position:absolute;left:79px;top:11px;width:12px;height:12px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 0 4px var(--linen),0 0 0 5px rgba(179,32,42,.35)}
.tl time{font:600 26px/1.1 var(--serif);color:var(--red);text-align:right;font-variant-numeric:lining-nums}
.tl h3{font:700 20px/1.25 var(--serif)}
.tl p{color:var(--muted);font-size:17.5px;line-height:1.45;margin-top:3px}

/* venue */
.venue{text-align:center}
.venue .mot{width:74px;margin:0 auto 14px}
.venue .aiv-place{width:100%;max-height:240px;object-fit:cover;margin:0 auto 14px}
.venue h3{font:600 30px/1.15 var(--serif);margin-top:6px}
.venue .addr{margin-top:6px}
.venue .how{color:var(--muted);font-size:17.5px;margin-top:12px}

/* dress */
.dress .dtitle{display:block;font:600 24px/1.3 var(--serif);color:var(--red);text-align:center}
.dress p{text-align:center;max-width:540px;margin:6px auto 0}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 14px;margin-top:26px}
.sw figure{text-align:center;width:76px}
.sw i{display:block;width:64px;height:64px;margin:0 auto;border-radius:50%;position:relative;box-shadow:0 8px 16px -10px rgba(60,30,30,.6),0 0 0 4px var(--paper),0 0 0 5px var(--line)}
.sw i::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6)}
.sw i.light::after{border-color:rgba(179,32,42,.35)}
.sw figcaption{font:600 15px/1.3 var(--serif);margin-top:10px;color:var(--muted)}

/* details */
.details{display:grid;gap:16px}
.details .card{text-align:center}
.details .mot{width:30px;margin:0 auto 10px}
.details h3{font:600 24px/1.2 var(--serif);color:var(--red);margin-bottom:6px}

/* RSVP */
.rcard{padding:64px 22px 62px}
.rcard .cn{position:absolute;width:calc(var(--rc,2px)*26);height:calc(var(--rc,2px)*26);z-index:1;pointer-events:none}
.rcard .cn svg{width:100%;height:100%}
.cn.tl_{top:6px;left:6px}.cn.tr_{top:6px;right:6px;transform:scaleX(-1)}.cn.bl_{bottom:6px;left:6px;transform:scaleY(-1)}.cn.br_{bottom:6px;right:6px;transform:scale(-1)}
#rsvp{display:grid;gap:20px;position:relative;z-index:2}
.f-label{display:block;font:700 13px/1.3 var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.f-input{width:100%;border:1.5px solid var(--line);background:#fff;padding:13px 14px;font:500 18px/1.4 var(--serif);color:var(--ink);outline:0;border-radius:0;resize:vertical}
.f-input::placeholder{color:#756a67}
.f-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,32,42,.12)}
.f-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f-seg label{position:relative;cursor:pointer}
.f-seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.f-seg span{display:block;text-align:center;padding:14px 6px;border:1.5px solid var(--line);background:#fff;font:600 17px/1.2 var(--serif);transition:.2s}
.f-seg input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.f-seg input:focus-visible+span,.chip input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.f-step{display:inline-flex;align-items:center;border:1.5px solid var(--line);background:#fff}
.f-step-btn{width:48px;height:46px;border:0;background:transparent;color:var(--red);font:600 24px/1 var(--serif);cursor:pointer}
.f-step-val{min-width:46px;text-align:center;font:600 24px/46px var(--serif);border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip span{display:inline-block;padding:10px 14px;border:1.5px solid var(--line);background:#fff;font:600 16px/1 var(--serif);cursor:pointer;transition:.2s}
.chip input:checked+span{border-color:var(--red);color:var(--red);background:#fdf1f1}
.f-yes{display:grid;gap:20px}.f-yes.off{display:none}
.f-submit{padding:18px;border:0;background:var(--red);color:#fff;font:700 15px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.f-submit:disabled{opacity:.6}
.f-error{color:var(--red);font-weight:700;font-size:16px}
.f-note{text-align:center;font-size:16px;color:var(--muted)}
.thanks{display:none;text-align:center;padding:4px 0;position:relative;z-index:2}
.thanks.on{display:block;animation:fade .9s}
.thanks .hrt2{width:84px;margin:0 auto 6px}
.thanks .big{font:400 60px/1.1 var(--script);color:var(--red)}
.thanks p{margin-top:8px}
.thanks button{margin-top:16px;border:0;background:none;color:var(--muted);font:700 13px/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;cursor:pointer}

/* contacts */
.people{display:grid;gap:16px}
.person{text-align:center}
.person h3{font:400 40px/1.15 var(--script)}
.person .role{font-size:17px;color:var(--muted)}
.person .tel{display:inline-block;margin-top:4px;color:var(--red);text-decoration:none;font-weight:700;font-variant-numeric:lining-nums}
.msg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;position:relative;z-index:1}
.msg a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;background:var(--linen);text-decoration:none;font:700 13px/1 var(--serif);color:var(--ink);transition:.2s}
.msg a svg{width:22px;height:22px;color:var(--red)}
.msg a:hover{background:var(--red);color:#fff}.msg a:hover svg{color:#fff}

/* finale */
footer{position:relative;text-align:center;margin-top:70px;overflow:hidden}
footer .fin{position:relative;z-index:2}
footer .wait{font:400 clamp(44px,12vw,60px)/1.1 var(--script)}
footer .fnames{font:400 clamp(40px,11vw,64px)/1.15 var(--script);margin-top:6px}
footer .fnames .p1{color:var(--red)}
footer p{color:var(--muted);margin-top:4px}
footer .fdate{font:600 22px/1.3 var(--serif);color:var(--ink);font-variant-numeric:lining-nums}
footer .fo{display:block;width:100%;margin-top:18px}
footer .fo svg{margin:0 auto}

@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{from{transform:translateY(-3px) rotate(-1deg)}to{transform:translateY(3px) rotate(1deg)}}
@keyframes floatR{from{transform:scaleX(-1) translateY(-3px) rotate(-1deg)}to{transform:scaleX(-1) translateY(3px) rotate(1deg)}}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.045)}}
@media (min-width:900px){
  .wrap{max-width:780px}
  .details{grid-template-columns:repeat(2,1fr)}
  .people{grid-template-columns:1fr 1fr}
  .rcard{padding:72px 56px 64px}
  .hero{padding-top:calc(var(--c)*30);padding-bottom:calc(var(--c)*32)}
  .h-title{font-size:min(58px,6.2vh)}
  .names .nm{font-size:min(92px,9.6vh)}
  .names .and{font-size:min(50px,5vh)}
  .doves{max-width:min(420px,44vh);margin-top:0}
  .hrt{width:min(96px,10vh)}
  .scroll{width:min(270px,30vh);margin-top:4px}
  .h-date{font-size:min(34px,3.7vh);margin-top:8px}
  .h-city{font-size:min(28px,3.1vh);margin-top:8px}
  .div{margin:min(10px,1vh) auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.h-title,.names,.doves,.h-date,.h-city,.rv{opacity:1!important;transform:none!important}.xframe.draw,.band.stitch{clip-path:none!important}.dv.r{transform:scaleX(-1)!important}}

  ${on('rsvp') && !(C.rsvp && C.rsvp.enabled === false) ? sec('Ці будзеце з намі?', `<div class="card rcard rv" data-orn="corners">${['tl_', 'tr_', 'bl_', 'br_'].map(k => `<div class="cn ${k}"></div>`).join('')}<form id="rsvp"></form>
     <div class="thanks" id="thanks" aria-live="polite"><div class="hrt2">${heart(3.6)}</div><div class="big">Дзякуй!</div><p id="thanksText"></p><button type="button" id="again">Змяніць адказ</button></div></div>`, 'rsvp-section', { stain: 'left:-160px;top:30px;width:330px;height:330px;opacity:.16;transform:rotate(60deg)' }) : ''}

  ${on('contacts') && C.contacts && C.contacts.length ? sec('Кантакты', `<div class="people">${C.contacts.map(c => `<div class="card person rv"><h3>${esc(c.name)}</h3><div class="role">${esc(c.role || '')}</div>${c.phone ? `<a class="tel" href="tel:+${String(c.phone).replace(/\D/g, '')}">${esc(c.phone)}</a>` : ''}<div class="msg">${contactLinks(c).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener" aria-label="${l.label}: ${esc(c.name)}">${icons[l.type]}${l.type === 'phone' ? 'Званок' : l.label}</a>`).join('')}</div></div>`).join('')}</div>`, 'contacts') : ''}

  <footer>
    ${stain('left:-140px;bottom:-60px;width:360px;height:360px;opacity:.22;transform:rotate(-40deg)')}
    ${stain('right:-150px;bottom:-40px;width:340px;height:360px;opacity:.2;transform:rotate(80deg)')}
    <div class="fin wrap rv"><div class="wait">Чакаем вас!</div>${divider('sm')}
      <div class="fnames"><span class="p1">${esc(P1)}</span> і ${esc(P2)}</div>
      <p class="fdate">${d.day} ${esc(d.monthBe)} ${d.year}${L.city ? ` · ${esc(L.city)}` : ''}</p>${T.closing ? `<p>${esc(T.closing)}</p>` : ''}</div>
    <div class="fo" data-orn="finale"></div>
  </footer>`;

  document.getElementById('app').innerHTML = html;

  /* ---- адаптыўная вышыўка: перамалёўваецца пад памер экрана ---- */
  const hero = $('#hero');
  const cellFor = w => Math.max(2.05, Math.min(3.3, w / 170, w >= 900 ? innerHeight / 255 : 9));
  let lastKey = '';
  function drawOrn() {
    const vw = document.documentElement.clientWidth, c = cellFor(vw);
    hero.style.setProperty('--c', c + 'px');
    fitNames();
    const hw = hero.clientWidth, hh = hero.clientHeight, key = `${hw}x${hh}`;
    if (hw < 40 || hh < 40) { lastKey = ""; setTimeout(drawOrn, 80); return; }
    if (key === lastKey) return; lastKey = key;
    const cols = Math.floor(hw / c), rows = Math.floor(hh / c);
    $('[data-orn=hero]').innerHTML = XS.svg(XS.frame(cols, rows, { tree: treeFit(c, cols, rows) }), c).replace('<svg', `<svg preserveAspectRatio="xMidYMid meet" style="margin:${(hh - rows * c) / 2}px ${(hw - cols * c) / 2}px"`);
    const bc = Math.max(2, Math.min(2.6, vw / 170));
    $$('[data-orn=band]').forEach(el => { el.innerHTML = XS.svg(XS.band(Math.min(Math.floor((el.clientWidth - 8) / bc), 300)), bc); });
    $$('[data-orn=finale]').forEach(el => { el.innerHTML = XS.svg(XS.finale(Math.floor(el.clientWidth / c)), c); });
    $$('[data-orn=photo]').forEach(el => { const pc = Math.max(2.2, el.clientWidth / 112); el.style.setProperty('--pc', pc + 'px'); $('.pfr', el).innerHTML = XS.svg(XS.photoFrame(Math.floor(el.clientWidth / pc), Math.floor(el.clientHeight / pc)), pc).replace('<svg', '<svg preserveAspectRatio="none"'); });
    $$('[data-orn=corners]').forEach(el => { const rc = vw < 600 ? 1.8 : 2.4; el.style.setProperty('--rc', rc + 'px'); const s = XS.svg(XS.small(M.corner, 33, 33, 0, 0), rc); $$('.cn', el).forEach(n => n.innerHTML = s); });
  }
  /* дрэва жыцця ў ніжніх кутах — толькі калі не чапляе тэкст */
  function treeFit(c, cols, rows) {
    const hb = hero.getBoundingClientRect(), ox = (hb.width - cols * c) / 2, oy = (hb.height - rows * c) / 2, rects = [];
    $$('.hero-in .h-title span, .hero-in .nm, .hero-in .and, .hero-in .h-date, .hero-in .h-city').forEach(el => { const r = document.createRange(); r.selectNodeContents(el); rects.push(r.getBoundingClientRect()); });
    $$('.hero-in .dv, .hero-in .scroll, .hero-in .div').forEach(el => rects.push(el.getBoundingClientRect()));
    const m = 2, pad = 8;
    for (let hgt = 58; hgt >= 26; hgt -= 4) for (const dx of [44, 48, 54, 64]) {
      const top = rows - 1 - m - 33 - (hgt + 7) - 3, bot = rows - 1 - m - 33, x0 = m + dx - 15, x1 = m + dx + 15;
      const L = [hb.left + ox + x0 * c - pad, hb.left + ox + x1 * c + pad], Rr = [hb.right - ox - x1 * c - pad, hb.right - ox - x0 * c + pad], T = hb.top + oy + top * c, B = hb.top + oy + bot * c;
      if (T < hb.top + oy + 70 * c) continue;
      const hit = rects.some(r => r.width && r.bottom > T && r.top < B && ((r.right > L[0] && r.left < L[1]) || (r.right > Rr[0] && r.left < Rr[1])));
      if (!hit) return { dx, hgt };
    }
    return null;
  }
  /* імёны: аўтаматычна памяншаем, калі доўгае імя не змяшчаецца */
  function fitNames() {
    $$('.names .nm').forEach(el => { el.style.fontSize = ''; const box = el.parentElement.clientWidth, w = el.scrollWidth; if (w > box) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * box / w * .98) + 'px'; });
  }
  let rt; const redo = () => { clearTimeout(rt); rt = setTimeout(drawOrn, 120); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(drawOrn);
  drawOrn();
  if ('ResizeObserver' in window && hero) { window.__aivObs = new ResizeObserver(redo); window.__aivObs.observe(hero); }
  else addEventListener('resize', redo);
  window.scrollTo(0, keepY);

  const forms = { d: ['дзень', 'дні', 'дзён'], h: ['гадзіна', 'гадзіны', 'гадзін'], m: ['хвіліна', 'хвіліны', 'хвілін'], s: ['секунда', 'секунды', 'секунд'] };
  if ($('.count')) window.__aivTimer = countdown(t => {
    if (t.done) { $('.count').hidden = true; $('.count-done').hidden = false; return; }
    ['d', 'h', 'm', 's'].forEach(k => { const b = $(`[data-k=${k}]`); if (b) { b.textContent = t[k]; $(`[data-l=${k}]`).textContent = plural(t[k], forms[k]); } });
  });
  if ($('#ics')) $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  if (form) {
    bindRSVP(form, data => { form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on'); });
    $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; });
  }
  reveal();
};
window.aivPaint();
</script>
</body>
</html>
