:root{--bg:#fbfaf5;--panel:#f3f1e7;--ink:#2d2f26;--muted:#5c5e50;--acct:#3f6b45;--btn:#3f6b45;--btnt:#ffffff;--line:rgba(63,107,69,.25);--namec:#3f6b45;--ph:#f3f1e7;--err:#a11d1d;--fd:"AIV Caveat",cursive;--fh2:"AIV Caveat",cursive;--fh:"AIV Alegreya",Georgia,serif;--fb:"AIV Alegreya",Georgia,serif;--fl:"AIV Alegreya Sans",Georgia,serif;--nw:600;--rad:12px;--hsize:clamp(38px,10vw,52px)}
*{box-sizing:border-box;margin:0;padding:0}
*{font-variant-numeric:lining-nums!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip;background:var(--bg)}
body{color:var(--ink);font:400 var(--fs,18px)/1.65 var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased;background:#fbfaf5;font-variant-numeric:lining-nums}
a{color:inherit}
svg{display:block}
.wrap{max-width:640px;margin:0 auto;padding:0 24px;position:relative}
.lbl{font:var(--lw,600) 11.5px/1.6 var(--fl);letter-spacing:.22em;text-transform:uppercase;color:var(--acct)}
.orn{width:min(84%,330px);height:auto;margin:0 auto;overflow:visible}
.orn.sm{width:200px}.orn.film{width:100%;max-width:none}
.dv{width:160px;height:30px;margin:0 auto 14px}
/* имена: скриптовые шрифты — без капса и разрядки */
.nm{display:block;font:var(--nw,400) var(--nsize,clamp(52px,15vw,96px))/1.12 var(--fd);color:var(--namec,var(--ink));white-space:nowrap;padding:0 .12em}
.names.caps .nm{text-transform:uppercase;letter-spacing:var(--nls,.06em)}
.names .amp{display:block;font:italic 400 clamp(22px,6vw,32px)/1.2 var(--fh);color:var(--acct);margin:4px 0}
/* HERO */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:56px 20px}
.hero-in{position:relative;width:100%;max-width:560px;z-index:1}
.lead{font:400 15px/1.7 var(--fl);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-wrap:balance}
.names{margin:20px 0 18px}
.when{margin-top:16px}
.when .d{display:block;font:400 clamp(22px,6vw,30px)/1.3 var(--fh);color:var(--ink);letter-spacing:.04em}
.when .t{display:block;margin-top:6px;font:500 13px/1.7 var(--fl);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.scroll{margin-top:30px;font:500 11px/1 var(--fl);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:inline-block;padding:10px 6px;border-bottom:1px solid var(--line)}
.v-card .hero-in,.v-arch .hero-in{background:var(--panel);padding:44px 26px 40px;box-shadow:0 18px 50px -24px rgba(0,0,0,.35);border-radius:var(--rad,4px)}
.v-card .hero-in::before,.v-arch .hero-in::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:inherit;pointer-events:none}
.v-arch .hero-in{border-radius:999px 999px var(--rad,6px) var(--rad,6px);padding-top:78px}
.v-editorial .hero{text-align:left;align-items:stretch;justify-content:space-between;padding:26px 22px 30px}
.v-editorial .hero-in{max-width:1100px;margin:0 auto}
.mast{display:flex;justify-content:space-between;gap:10px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0;font:600 10.5px/1.4 var(--fl);letter-spacing:.18em;text-transform:uppercase}
.v-editorial .names{margin:8vh 0 3vh}
.v-editorial .nm{font-size:clamp(64px,19vw,190px);line-height:.92;padding:0;white-space:normal}
.v-editorial .names .amp{margin:6px 0 6px .1em;text-align:left}
.v-editorial .lead{text-align:left}
.v-editorial .when{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;border-top:1px solid var(--ink);padding-top:12px}
.v-editorial .when .d{font-size:22px}
.v-polaroid .pol{background:#fffdf8;color:#2a2a2a;padding:14px 14px 18px;width:min(84vw,340px);margin:0 auto 26px;transform:rotate(-3deg);box-shadow:0 20px 40px -18px rgba(0,0,0,.45);position:relative}
.v-polaroid .pol::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:rgba(255,236,180,.75);transform:rotate(4deg)}
.pol .shot{position:relative;overflow:hidden;aspect-ratio:1;background:var(--ph);display:flex;align-items:center;justify-content:center}
.pol .nm{color:#2a2a2a;font-size:clamp(34px,10vw,46px);margin-top:10px;white-space:normal;line-height:1.1}
.v-split .hero{padding:36px 20px}
.v-split .hero-grid{display:grid;gap:30px;width:100%;max-width:1100px;align-items:center}
.v-split .archph{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:999px 999px 0 0;background:var(--ph);max-width:320px;width:min(60vw,300px);margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.v-film .hero{padding:0 0 40px;justify-content:space-between}
.v-film .hero-in{padding:0 20px}
.phl{position:absolute;left:50%;top:50%;z-index:0;width:max-content;max-width:8.5em;transform:translate(-50%,-50%);font:500 9px/1.25 var(--fl);letter-spacing:.02em;text-transform:none;color:var(--muted);text-align:center;padding:0;pointer-events:none}.photo img,.shot img,.archph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}
.fi{opacity:0;animation:fi 1.6s cubic-bezier(.25,.6,.2,1) forwards}.d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.8s}.d4{animation-delay:1.15s}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* секции */
section.s{padding:76px 0;position:relative}
section.s.alt{background:var(--panel)}
.sh{text-align:center;margin-bottom:34px}
.sh h2{font:var(--hw,400) var(--hsize,clamp(30px,8vw,42px))/1.2 var(--fh2);color:var(--headc,var(--ink));text-wrap:balance}
.hs-caps .sh h2{text-transform:uppercase;letter-spacing:.14em;font-size:clamp(22px,6vw,28px)}
.sh .no{display:block;font:500 12px/1 var(--fl);letter-spacing:.3em;color:var(--acct);margin-bottom:12px}
.v-editorial .sh{text-align:left;border-bottom:1px solid var(--ink);padding-bottom:10px}
.v-editorial .sh .dv{display:none}
.p{text-align:center;font-size:inherit;text-wrap:pretty}.p+.p{margin-top:.9em}
.v-editorial .p{text-align:left}
.sig{text-align:center;margin-top:24px;font:400 34px/1.3 var(--fd);color:var(--namec,var(--ink))}
.names.caps~.x,.sig.caps{text-transform:uppercase;letter-spacing:.08em;font-size:24px}
.muted{color:var(--muted)}
.rv{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease}.rv.in{opacity:1;transform:none}
/* фото */
.photo{width:min(84vw,400px);margin:0 auto;position:relative}
.photo .in{position:relative;aspect-ratio:4/5;background:var(--ph);border-radius:var(--prad,var(--rad,2px));overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo figcaption{text-align:center;margin-top:14px;font-style:italic;color:var(--muted)}
/* дата + календарь */
.cal{max-width:340px;margin:0 auto;background:var(--panel2,transparent);padding:18px 14px;border-radius:var(--rad,4px)}
.cal .mh{text-align:center;font:400 24px/1.2 var(--fh);margin-bottom:12px;text-transform:capitalize}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .g span{font:500 15px/38px var(--fb);height:38px}
.cal .g .wd{font:600 10.5px/24px var(--fl);height:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cal .g .on{background:var(--btn);color:var(--btnt);border-radius:50%;font-weight:700}
.cal .g .on.heart{border-radius:0;background:none;color:var(--btnt);position:relative}
.cal .g .on.heart::before{content:"";position:absolute;inset:2px;background:var(--btn);clip-path:path('M17 33C6 24 1 18 1 11 1 5 5.5 1 10.5 1 13.5 1 15.8 2.6 17 4.8 18.2 2.6 20.5 1 23.5 1 28.5 1 33 5 33 11 33 18 28 24 17 33Z');z-index:-1}
.cal .g .on.heart{z-index:0}
.bigtime{text-align:center;margin-top:20px;font:400 20px/1.5 var(--fh)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:34px auto 0}
.count div{text-align:center;padding:12px 2px;border:1px solid var(--line);border-radius:var(--rad,4px);background:var(--panel2,transparent)}
.count b{display:block;font:400 clamp(30px,9vw,40px)/1.1 var(--fh);font-variant-numeric:tabular-nums lining-nums!important}
.count small{display:block;margin-top:4px;font:500 10.5px/1.2 var(--fl);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:28px;padding:15px 28px;min-height:48px;background:var(--btn);color:var(--btnt);border:0;border-radius:var(--brad,var(--rad,2px));text-decoration:none;cursor:pointer;font:600 12.5px/1.2 var(--fl);letter-spacing:.18em;text-transform:uppercase;transition:.3s}
.btn:hover,.btn:focus-visible{filter:brightness(1.08);outline:2px solid var(--acct);outline-offset:3px}
.btn svg{width:18px;height:18px}
/* место */
.venue{text-align:center}
.venue h3{font:400 clamp(26px,7vw,34px)/1.25 var(--fh);margin-top:10px}
.venue .addr{margin-top:8px;color:var(--muted)}
.venue .how{margin-top:16px}
.mapcard{margin:26px auto 0;max-width:420px;height:150px;border-radius:var(--rad,4px);border:1px solid var(--line);background:var(--panel2,var(--panel));position:relative;overflow:hidden}
.mapcard svg{position:absolute;inset:0;width:100%;height:100%}
/* программа */
.prog{list-style:none;max-width:480px;margin:0 auto}
.prog li{display:grid;grid-template-columns:72px 24px 1fr;padding-bottom:26px;position:relative}
.prog li::before{content:"";position:absolute;left:83px;top:22px;bottom:-2px;width:1px;background:var(--line)}
.prog li:last-child::before{display:none}
.prog time{font:400 21px/1.2 var(--fh);text-align:right;padding-right:10px;color:var(--ink)}
.prog i{width:9px;height:9px;border-radius:50%;background:var(--btn);margin:8px 0 0 7px}
.prog b{display:block;font:600 15px/1.4 var(--fl);letter-spacing:.06em;padding-top:2px}
.prog small{display:block;color:var(--muted);font-size:16px;margin-top:2px}
/* дресс-код */
.sw{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:26px}
.sw figure{width:66px;text-align:center}
.sw i{display:block;width:44px;height:44px;margin:0 auto;border-radius:var(--swr,50%);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line)}
.sw figcaption{margin-top:10px;font:500 11.5px/1.3 var(--fl);color:var(--muted)}
.dcode{text-align:center;font:400 30px/1.3 var(--fh);margin-bottom:12px}
/* пожелания */
.notes{display:grid;gap:14px;max-width:560px;margin:0 auto}
.notes div{padding:22px 20px;border:1px solid var(--line);border-radius:var(--rad,4px);text-align:center;background:var(--panel2,transparent)}
.notes h3{font:600 12.5px/1.5 var(--fl);letter-spacing:.16em;text-transform:uppercase;color:var(--acct);margin-bottom:8px}
/* RSVP */
.rbox{max-width:520px;margin:0 auto;background:var(--panel);color:var(--ink);padding:30px 22px;border-radius:var(--rad,4px);border:1px solid var(--line);position:relative}
#rsvp{display:grid;gap:22px}
.f-label{display:block;font:600 11.5px/1.4 var(--fl);letter-spacing:.14em;text-transform:uppercase;color:var(--acct);margin-bottom:8px}
.f-input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;font:400 17px/1.4 var(--fb);border-radius:var(--irad,var(--rad,2px));outline:0}
.f-input::placeholder{color:var(--muted);opacity:.85}
.f-input:focus{border-color:var(--acct);box-shadow:0 0 0 2px var(--line)}
.f-seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-seg label{position:relative;cursor:pointer;display:flex}
.f-seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.f-seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:50px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:var(--irad,var(--rad,2px));font:600 13px/1.3 var(--fl);transition:.3s;background:var(--bg)}
.f-seg input:checked+span{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.f-seg input:focus-visible+span,.chip input:focus-visible+span{outline:2px solid var(--acct);outline-offset:2px}
.f-step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--irad,var(--rad,2px));background:var(--bg)}
.f-step-btn{width:46px;height:46px;border:0;background:transparent;color:var(--ink);font:400 24px/1 var(--fb);cursor:pointer}
.f-step-val{min-width:44px;text-align:center;font:600 19px/46px var(--fb)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip span{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:999px;font:500 14px/1 var(--fb);cursor:pointer;background:var(--bg);transition:.3s}
.chip input:checked+span{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.f-yes{display:grid;gap:22px}.f-yes.off{display:none}
.f-submit{padding:17px;min-height:52px;border:0;background:var(--btn);color:var(--btnt);font:600 13px/1 var(--fl);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:var(--brad,var(--rad,2px))}
.f-submit:disabled{opacity:.6}
.f-error{color:var(--err);font-weight:600}
.thanks{display:none;text-align:center}
.thanks.on{display:block;animation:fi 1s}
.thanks .big{font:400 40px/1.3 var(--fd);color:var(--namec,var(--ink))}
.names.caps~* .thanks .big{text-transform:uppercase}
.thanks p{margin-top:12px}
.thanks button{margin-top:18px;border:0;background:none;color:var(--acct);font:600 12px/1 var(--fl);letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px;cursor:pointer}
/* контакты */
.people{display:grid;gap:14px;max-width:560px;margin:0 auto}
.person{text-align:center;padding:22px;border:1px solid var(--line);border-radius:var(--rad,4px);background:var(--panel2,transparent)}
.person h3{font:400 26px/1.3 var(--fh);margin-top:6px}
.person .tel{display:inline-block;margin-top:4px;text-decoration:none;font-size:19px;border-bottom:1px solid var(--line)}
.msg{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.msg a{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;min-height:40px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font:600 12px/1 var(--fl);color:var(--ink)}
.msg a svg{width:16px;height:16px}
/* финал */
footer{text-align:center;padding:80px 0 70px;background:var(--fbg,transparent);color:var(--fink,var(--ink))}
footer .bye{font-size:20px;font-style:italic;color:var(--fmuted,var(--muted))}
footer .fn{margin-top:14px;font:400 clamp(40px,11vw,60px)/1.2 var(--fd);color:var(--fname,var(--namec,var(--ink)))}
footer .fn.caps{text-transform:uppercase;letter-spacing:.06em;font-size:clamp(30px,8vw,44px)}
footer .fd{margin-top:10px;font:500 12px/1.8 var(--fl);letter-spacing:.24em;text-transform:uppercase;color:var(--fmuted,var(--muted))}
footer .brand{margin-top:34px;font:500 10px/1 var(--fl);letter-spacing:.2em;text-transform:uppercase;color:var(--fmuted,var(--muted));opacity:.9;text-decoration:none;display:inline-block}
@media (min-width:900px){
  .wrap{max-width:720px}
  section.s{padding:100px 0}
  .people{grid-template-columns:1fr 1fr}
  .notes{grid-template-columns:1fr 1fr;max-width:720px}
  .notes div:only-child{grid-column:1/-1}
  .rbox{padding:44px 50px}
  .v-split .hero-grid{grid-template-columns:1.1fr .9fr;text-align:left}
  .v-split .hero-grid .lead,.v-split .hero-grid .names{text-align:left}
  .v-split .archph{width:100%;max-width:380px}
  .v-split .hero-grid .orn{margin-left:0}.v-split .hero-grid .when{text-align:left}
  .v-card .hero-in,.v-arch .hero-in{padding:60px 60px 54px}
  .v-editorial .hero{padding:36px 60px 40px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fi,.rv{opacity:1!important;transform:none!important}}
.venue .aiv-place{width:100%;max-height:220px;object-fit:cover;display:block;margin:0 auto 16px}
</style>

  ${notes.length ? sec('Пожелания', `<div class="notes gifts">${notes.map(x => `<div class="rv card"><h3>${esc(x.title || '')}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>`, 'wishes', true) : ''}
  ${on('rsvp') && R.enabled !== false ? sec('Анкета гостя', `<p class="p rv" style="margin-bottom:26px">${dl ? `Просим подтвердить Ваше присутствие до ${esc(dl)} года` : 'Просим подтвердить Ваше присутствие'}</p><div class="rbox rv"><form id="rsvp"></form><div class="thanks" id="thanks" aria-live="polite"><div class="big">Спасибо!</div><p id="thanksText"></p><button type="button" id="again">Изменить ответ</button></div></div>`, 'rsvp-section') : ''}
  ${on('contacts') && C.contacts && C.contacts.length ? sec('Контакты', `<div class="people">${C.contacts.map(c => `<div class="person rv"><p class="lbl">${esc(c.role || '')}</p><h3>${esc(c.name)}</h3>${c.phone ? `<a class="tel" href="tel:+${String(c.phone).replace(/\D/g, '')}">${esc(c.phone)}</a>` : ''}<div class="msg">${contactLinks(c).filter(l => l.type !== 'phone').map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener" aria-label="${l.label}: ${esc(c.name)}">${icons[l.type] || ''}${l.label}</a>`).join('')}</div></div>`).join('')}</div>`, 'contacts', true) : ''}
  <footer class="rv"><div class="wrap">${D.top || ''}${T.closing ? `<p class="bye">${esc(T.closing)}</p>` : ''}<p class="fn ${nc}">${esc(P1)} ${esc(D.amp || 'и')} ${esc(P2)}</p><p class="fd">${esc(d.dotted)} · ${esc(L.city || '')}</p></div></footer>`;
  document.getElementById('app').innerHTML = html;

  function fitNames() { $$('.names .nm').forEach(el => { el.style.fontSize = ''; const box = el.parentElement.clientWidth, w = el.scrollWidth; if (w > box) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * box / w * .96) + 'px'; }); }
  if (window.__aivFit) removeEventListener('resize', window.__aivFit);
  window.__aivFit = fitNames;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitNames); addEventListener('resize', fitNames); fitNames();
  const forms = { d: ['день','дня','дней'], h: ['час','часа','часов'], m: ['минута','минуты','минут'], s: ['секунда','секунды','секунд'] };
  if ($('.count')) window.__aivTimer = countdown(t => { if (t.done) { $('.count').hidden = true; $('#cdone').hidden = false; return; }
    ['d','h','m','s'].forEach(k => { const b = $(`[data-k=${k}]`); if (b) { b.textContent = t[k]; $(`[data-l=${k}]`).textContent = plural(t[k], forms[k]); } }); });
  if ($('#ics')) $('#ics').addEventListener('click', downloadICS);
  const form = $('#rsvp'), thanks = $('#thanks');
  if (form) { bindRSVP(form, data => { form.style.display = 'none'; $('#thanksText').innerHTML = thanksText(data); thanks.classList.add('on'); });
    const note = form.querySelector('.f-note'); if (note) note.remove();
    $('#again').addEventListener('click', () => { thanks.classList.remove('on'); form.style.display = ''; }); }
  reveal();
  if (keepY) window.scrollTo(0, keepY);
};
window.aivPaint();
</script>
</body>
